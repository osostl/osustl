<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كوفي دوفي">
<meta name="theme-color" content="#5a3721">
<title>كاشير كوفي دوفي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe6; --card:#fff; --ink:#2b1d14; --mut:#8a7565; --line:#eadfce;
  --brown:#5a3721; --brown2:#7b4d2d; --gold:#c8873a; --gold2:#f6e7d2;
  --green:#1f8a5b; --green2:#e3f4ec; --red:#c0392b; --red2:#fbe9e7; --blue:#2563a8;
  --r:16px; --sh:0 6px 20px rgba(60,35,15,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text;font-family:inherit;font-size:16px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
.hidden{display:none!important}
.num{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brown);color:#fff;border-color:var(--brown)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{background:var(--red);color:#fff;border-color:var(--red)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:30px;background:var(--card);border:1.5px solid var(--line);font-weight:600;white-space:nowrap}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}

/* ---------- top bar ---------- */
.top{height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--brown);color:#fff;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;white-space:nowrap}
.brand .cup{width:40px;height:40px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-size:22px}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:-3px}
.nav{display:flex;gap:6px;margin-inline-start:12px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}
.nav button{min-height:44px;padding:6px 14px;border-radius:12px;color:#f3e4d2;font-weight:600;white-space:nowrap}
.nav button.on{background:rgba(255,255,255,.16);color:#fff}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.top .btn.sm{padding:6px 10px}
.who .pill{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:30px}
.top .btn{min-height:40px;background:rgba(255,255,255,.12);border-color:transparent;color:#fff}

/* ---------- sale screen ---------- */
.pos{display:grid;grid-template-columns:1fr 390px;height:calc(100vh - 64px);height:calc(100dvh - 64px)}
.menu{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.cats{display:flex;gap:8px;padding:12px 14px 6px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.search{margin:6px 14px;position:relative}
.search input{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);padding:8px 44px 8px 14px;background:var(--card)}
.search span{position:absolute;right:14px;top:11px;opacity:.5}
.grid{flex:1;overflow-y:auto;padding:6px 14px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.item{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 12px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;border:2px solid transparent;position:relative}
.item:active{transform:scale(.97);border-color:var(--gold)}
.item .ic{font-size:30px;line-height:1}
.item .nm{font-weight:700;font-size:16px;margin-top:8px}
.item .pr{color:var(--brown2);font-weight:700;font-size:15px}
.item .pr small{color:var(--mut);font-weight:500;font-size:12px}
.item.off{opacity:.4}

.cart{background:var(--card);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.cart-h b{font-size:18px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{min-height:38px;padding:4px 14px;border-radius:10px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--brown);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.lines{flex:1;overflow-y:auto;padding:6px 10px}
.line{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line)}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:15px}
.line .info small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4}
.line .lp{font-weight:700;min-width:62px;text-align:left}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border-radius:10px;background:var(--bg);font-size:20px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:50px 20px}
.empty .big{font-size:54px;margin-bottom:8px;opacity:.6}
.cust{padding:6px 12px}
.cust input{width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);padding:6px 12px;background:var(--bg)}
.totals{padding:10px 14px;border-top:1px solid var(--line);background:#fdfaf6}
.totals .r{display:flex;justify-content:space-between;padding:2px 0;color:var(--mut);font-size:14.5px}
.totals .r.big{color:var(--ink);font-size:24px;font-weight:800;padding-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 12px 14px}
.acts .pay{grid-column:1/-1;min-height:62px;font-size:21px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(30,18,8,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2}
.mh b{font-size:19px}
.mh .x{width:42px;height:42px;border-radius:12px;background:var(--bg);font-size:22px}
.mb{padding:16px 20px}
.mf{padding:12px 20px 18px;display:flex;gap:10px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.mf .btn{flex:1}
.grp{margin-bottom:16px}
.grp h4{font-size:14px;color:var(--mut);margin-bottom:8px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.opt small{color:var(--mut);font-weight:500;margin-inline-start:4px}
.opt.on{border-color:var(--brown);background:var(--gold2);color:var(--brown)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:14px;color:var(--mut);margin-bottom:5px;font-weight:600}
.f input,.f select,.f textarea{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);padding:8px 12px;background:#fff}
.f textarea{min-height:80px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}

/* ---------- payment ---------- */
.paytot{text-align:center;padding:6px 0 14px}
.paytot small{color:var(--mut)}
.paytot b{display:block;font-size:44px;font-weight:800;color:var(--brown)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tabs3 button{min-height:62px;border-radius:14px;border:2px solid var(--line);font-weight:800;font-size:17px;background:var(--card)}
.tabs3 button.on{border-color:var(--brown);background:var(--gold2);color:var(--brown)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.quick button{min-height:52px;border-radius:12px;background:var(--bg);font-weight:800;font-size:17px}
.bigin{width:100%;min-height:64px;font-size:30px;text-align:center;border-radius:14px;border:2px solid var(--line);font-weight:800;direction:ltr}
.change{margin-top:12px;padding:14px;border-radius:14px;text-align:center;font-size:18px;font-weight:700;background:var(--bg)}
.change.ok{background:var(--green2);color:var(--green)}
.change.bad{background:var(--red2);color:var(--red)}
.change b{font-size:30px;display:block}
.note{background:var(--gold2);border-radius:14px;padding:14px;color:var(--brown);font-size:15px;line-height:1.7}
.note.red{background:var(--red2);color:var(--red)}
.note.green{background:var(--green2);color:var(--green)}

/* ---------- PIN / login ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 70% -10%,#e8cfae,transparent),var(--bg)}
.lbox{background:var(--card);border-radius:26px;box-shadow:0 20px 60px rgba(60,35,15,.15);padding:28px;width:100%;max-width:440px;text-align:center}
.lbox .cupbig{width:74px;height:74px;border-radius:22px;background:var(--brown);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 10px}
.lbox h1{font-size:26px}
.lbox .sub{color:var(--mut);margin-bottom:18px}
.users{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brown2);display:block}
.dots i.f{background:var(--brown2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:64px;border-radius:16px;background:var(--bg);font-size:26px;font-weight:800}
.pad button:active{background:var(--gold2)}
.hint{font-size:12.5px;color:var(--mut);margin-top:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- pages (orders/reports/settings) ---------- */
.page{height:calc(100vh - 64px);height:calc(100dvh - 64px);overflow-y:auto;padding:16px}
.wrap{max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi small{color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--brown)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{color:var(--mut);font-weight:700;text-align:right;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line)}
table.t tr.click{cursor:pointer}
table.t tr.click:active{background:var(--bg)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--bg)}
.tag.g{background:var(--green2);color:var(--green)}
.tag.r{background:var(--red2);color:var(--red)}
.tag.b{background:#e6eef8;color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.bars div{flex:1;background:var(--gold);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.stabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.mi{display:grid;grid-template-columns:1fr 110px 110px 110px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mi input{min-height:42px;border-radius:10px;border:1.5px solid var(--line);padding:4px 10px;width:100%}
.toggle{display:flex;align-items:center;gap:10px;min-height:46px;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--brown)}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-weight:600;z-index:90;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}

/* ---------- receipt (screen preview + print) ---------- */
.rcpt{background:#fff;color:#000;width:300px;margin:0 auto;padding:14px 12px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:13px;line-height:1.45;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.rcpt.w58{width:220px;font-size:11.5px}
.rcpt .c{text-align:center}
.rcpt h2{font-size:19px;margin:2px 0}
.rcpt .hr{border-top:1px dashed #000;margin:7px 0}
.rcpt table{width:100%;border-collapse:collapse}
.rcpt td{padding:2px 0;vertical-align:top}
.rcpt td.p{text-align:left;white-space:nowrap;padding-inline-start:6px}
.rcpt .o{font-size:11px;color:#333}
.rcpt .tot td{font-size:17px;font-weight:800;padding-top:4px}
.rcpt .big{font-size:40px;font-weight:800;text-align:center;line-height:1.1}
.rcpt .qr{display:flex;justify-content:center;margin-top:8px}
.rcpt .qr svg{width:120px;height:120px}
#print{display:none}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;height:auto}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  #print .rcpt{box-shadow:none;margin:0;width:72mm;padding:3mm 2mm}
  #print .rcpt.w58{width:48mm}
}

/* ---------- responsive (iPad portrait / phones) ---------- */
@media (max-width:900px){
  .pos{grid-template-columns:1fr 330px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .nav button{padding:6px 10px}
  .brand small{display:none}
}
@media (max-width:700px){
  .pos{grid-template-columns:1fr;grid-template-rows:1fr auto;height:auto;min-height:calc(100dvh - 64px)}
  .cart{border:0;border-top:2px solid var(--line)}
  .lines{max-height:38vh}
  .who .pill.sh{display:none}
  .mi{grid-template-columns:1fr 1fr}
}

/* বাংলা worker mode + photos + guide */
.bn{font-family:"Noto Sans Bengali","IBM Plex Sans Arabic",sans-serif;font-weight:700}
.ar2{display:block;font-size:.72em;color:var(--mut);font-weight:500;line-height:1.2}
.bn2{display:block;font-family:"Noto Sans Bengali",sans-serif;font-size:.78em;color:var(--mut)}
.opt.sm2{min-height:40px;padding:4px 10px;font-size:14px}
.item .ph{width:100%;height:78px;object-fit:cover;border-radius:12px;margin-bottom:4px}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gcard .gph{width:100%;height:150px;object-fit:cover}.gcard .ic{font-size:64px;text-align:center;padding:16px 0;background:var(--bg)}
.gcard .gtx{padding:10px 12px}.gcard .gtx b.bn{font-size:19px;display:block}.gcard .gr{font-size:14px;margin-top:6px;font-family:"Noto Sans Bengali","IBM Plex Sans Arabic",sans-serif}

</style>
</head>

<div id="app"></div>
<div id="print"></div>
<div class="toast" id="toast"></div>

			if (this.modules[r][6] !== null) {
				continue;

			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);

				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {

			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;

			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}

		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;

					row -= inc;
					inc = -inc;
					break;
				}
			}
		}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

      r.onupgradeneeded = () => { const d = r.result, has = n => d.objectStoreNames.contains(n);
        if (!has("orders")) d.createObjectStore("orders", {keyPath: "id"}).createIndex("day", "day");
        if (!has("shifts")) d.createObjectStore("shifts", {keyPath: "id"});
        if (!has("expenses")) d.createObjectStore("expenses", {keyPath: "id"}).createIndex("day", "day");

  _ls(s){ return LS.get("cd_" + s, []); },

  $$("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === "c") PIN = PIN.slice(0, -1); else if (k === "ok") return go(); else if (PIN.length < 6) PIN += k; $("#dots").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < PIN.length ? "f" : ""}"></i>`).join("") + (PIN.length > 4 ? "•".repeat(PIN.length - 4) : ""); if (PIN.length === PICK.pin.length && PIN === PICK.pin) go(); });

/* manager approval: resolves true if a manager PIN is typed (or the user is a manager) */
function askManager(why){
  return new Promise(res => {
    if (isMgr()) return res(true);
    let p = ""; const ov = modal(`<div class="mh"><b>🔐 موافقة المدير</b><button class="x" data-close>×</button></div><div class="mb" style="text-align:center"><p style="color:var(--mut)">${esc(why)}</p><div class="dots" id="mdots">${"<i></i>".repeat(4)}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-k="c">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--brown);color:#fff;font-size:18px">موافقة</button></div></div>`, () => res(false));
    const ok = () => { const m = CFG.users.find(u => u.role === "manager" && u.pin === p); if (m) { closeModal(ov); res(true); } else { p = ""; dots(); ov.querySelector(".modal").classList.add("shake"); setTimeout(() => ov.querySelector(".modal").classList.remove("shake"), 400); toast("رمز المدير غير صحيح", 1); } };
    const dots = () => ov.querySelector("#mdots").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < p.length ? "f" : ""}"></i>`).join("");
    ov.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === "c") p = p.slice(0, -1); else if (k === "ok") return ok(); else if (p.length < 6) p += k; dots(); });
  });
}

/* ---------------- modal helpers ---------------- */
function modal(inner, onClose, wide){
  const ov = document.createElement("div"); ov.className = "ov"; ov.innerHTML = `<div class="modal ${wide ? "wide" : ""}">${inner}</div>`;
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) { closeModal(ov); onClose && onClose(); } });
  document.body.appendChild(ov); return ov;
}
function closeModal(ov){ if (ov && ov.parentNode) ov.parentNode.removeChild(ov); }
function confirmBox(msg, okTxt = "تأكيد", danger){ return new Promise(res => { const ov = modal(`<div class="mh"><b>تأكيد</b><button class="x" data-close>×</button></div><div class="mb"><p style="font-size:17px">${msg}</p></div><div class="mf"><button class="btn" data-close>رجوع</button><button class="btn ${danger ? "warn" : "pri"}" id="cfok">${esc(okTxt)}</button></div>`, () => res(false)); ov.querySelector("#cfok").onclick = () => { closeModal(ov); res(true); }; }); }

/* ---------------- numbering ---------------- */
function nextNo(peek){ const d = dayOf(); const n = CFG.seq.day === d ? CFG.seq.n + 1 : 1; if (!peek) { CFG.seq = {day: d, n}; CFG.serial++; saveCfg(); } return n; }

/* ---------------- payment ---------------- */
function payModal(){
  const t = totals(), st = {m: "cash", recv: "", cashPart: "", ref: ""};
  const draw = () => {
    const recv = r2(parseFloat(st.recv)), cp = r2(parseFloat(st.cashPart));
    let ok = false, info = "";
    if (st.m === "cash") { ok = recv >= t.total; info = !st.recv ? `<div class="change">اكتب المبلغ المستلم أو اختر من الأزرار</div>` : ok ? `<div class="change ok">الباقي للعميل<b class="num">${m2(recv - t.total)} ${cur()}</b></div>` : `<div class="change bad">المبلغ ناقص<b class="num">${m2(t.total - recv)} ${cur()}</b></div>`; }
    if (st.m === "card") { ok = true; info = `<div class="note">💳 اطلب من العميل يدفع على <b>جهاز الشبكة</b> بمبلغ <b class="num">${m2(t.total)} ${cur()}</b>.<br>بعد ما يطلع «مقبولة» اضغط تأكيد.</div><label class="f" style="margin-top:12px"><span>رقم العملية أو آخر ٤ أرقام (اختياري — للمطابقة)</span><input id="pref" class="num" value="${esc(st.ref)}"></label>`; }
    if (st.m === "split") { ok = cp > 0 && cp < t.total; info = `<label class="f"><span>الجزء النقدي (${cur()})</span><input class="bigin num" id="pcp" inputmode="decimal" value="${esc(st.cashPart)}"></label>${ok ? `<div class="change ok">على الشبكة<b class="num">${m2(t.total - cp)} ${cur()}</b></div>` : `<div class="change">النقدي لازم يكون أقل من الإجمالي</div>`}`; }
    const q = [...new Set([t.total, Math.ceil(t.total / 5) * 5, Math.ceil(t.total / 10) * 10, 50, 100, 200, 500].filter(v => v >= t.total))].slice(0, 8);
    ov.querySelector(".modal").innerHTML = `<div class="mh"><b>💳 الدفع</b><button class="x" data-close>×</button></div><div class="mb">
      <div class="paytot"><small>المطلوب</small><b class="num">${m2(t.total)} ${cur()}</b></div>
      <div class="tabs3"><button data-pm="cash" class="${st.m === "cash" ? "on" : ""}">💵 كاش</button><button data-pm="card" class="${st.m === "card" ? "on" : ""}">💳 شبكة</button><button data-pm="split" class="${st.m === "split" ? "on" : ""}">🔀 مختلط</button></div>
      ${st.m === "cash" ? `<input class="bigin num" id="precv" inputmode="decimal" placeholder="المبلغ المستلم" value="${esc(st.recv)}"><div class="quick">${q.map(v => `<button data-q="${v}" class="num">${v === t.total ? "بالضبط" : v}</button>`).join("")}</div>` : ""}
      ${info}</div><div class="mf"><button class="btn" data-close>رجوع</button><button class="btn ok" id="pgo" ${ok ? "" : "disabled"} style="font-size:19px">✅ تأكيد الدفع</button></div>`;
    ov.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { st.m = b.dataset.pm; draw(); });
    ov.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { st.recv = String(b.dataset.q); draw(); });
    const pr = ov.querySelector("#precv"); if (pr) { pr.oninput = () => { st.recv = pr.value; const pos = pr.selectionStart; draw(); const x = ov.querySelector("#precv"); x.focus(); x.setSelectionRange(pos, pos); }; }
    const pc = ov.querySelector("#pcp"); if (pc) { pc.oninput = () => { st.cashPart = pc.value; const pos = pc.selectionStart; draw(); const x = ov.querySelector("#pcp"); x.focus(); x.setSelectionRange(pos, pos); }; }
    const rf = ov.querySelector("#pref"); if (rf) rf.oninput = () => st.ref = rf.value.slice(0, 30);

/* =====================================================================
   طباعة مباشرة على طابعات Epson عبر الشبكة (ePOS-Print) — بدون نافذة الطباعة
   يرسم الإيصال كصورة (يحفظ العربي كما هو) ويرسلها لعنوان IP الطابعة
   ===================================================================== */
const EP = {
  url(){ const P = CFG.settings.printer || {}, proto = P.proto || (location.protocol === "https:" ? "https" : "http");
    return `${proto}://${P.ip}${P.port ? ":" + P.port : ""}/cgi-bin/epos/service.cgi?devid=${encodeURIComponent(P.devid || "local_printer")}&timeout=15000`; },
  /* render receipt HTML → 1-bit raster rows */
  async raster(html){
    const dots = CFG.settings.paper === 58 ? 384 : 576, S = 2, w = dots / S;
    const box = document.createElement("div"); box.style.cssText = `position:fixed;top:0;left:-20000px;width:${w}px;background:#fff`; box.innerHTML = html.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, "");
    const r0 = box.firstElementChild; if (r0) { r0.style.width = w + "px"; r0.style.padding = "0 10px"; r0.style.margin = "0"; r0.style.boxSizing = "border-box"; }
    document.body.appendChild(box);
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    const B = box.getBoundingClientRect(), H = Math.ceil(B.height * S) + 8;
    const cv = document.createElement("canvas"); cv.width = dots; cv.height = H; const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, dots, H); g.fillStyle = "#000"; g.strokeStyle = "#000";
    // borders (separator lines)
    box.querySelectorAll("*").forEach(el => { const cs = getComputedStyle(el), R = el.getBoundingClientRect();
      [["Top", R.top], ["Bottom", R.bottom - parseFloat(cs.borderBottomWidth)]].forEach(([k, y]) => { const bw = parseFloat(cs["border" + k + "Width"]); if (bw > 0 && cs["border" + k + "Style"] !== "none") {
        const yy = (y - B.top) * S, x0 = (R.left - B.left) * S, x1 = (R.right - B.left) * S;
        if (cs["border" + k + "Style"] === "dashed" || cs["border" + k + "Style"] === "dotted") { for (let x = x0; x < x1; x += 12) g.fillRect(x, yy, 7, Math.max(2, bw * S)); } else g.fillRect(x0, yy, x1 - x0, Math.max(2, bw * S)); } }); });
    // QR codes (svg paths from qrSVG)
    box.querySelectorAll("svg").forEach(sv => { const R = sv.getBoundingClientRect(), vb = (sv.getAttribute("viewBox") || "").split(/\s+/).map(Number); if (vb.length < 4) return;
      const k = Math.max(2, Math.floor(R.width * S / vb[2])), pad = Math.floor((R.width * S - k * vb[2]) / 2), ox = Math.round((R.left - B.left) * S) + pad - vb[0] * k, oy = Math.round((R.top - B.top) * S) + pad - vb[1] * k, p = sv.querySelector("path"); if (!p) return;
      (p.getAttribute("d").match(/M\d+ \d+/g) || []).forEach(m => { const [c, r] = m.slice(1).split(" ").map(Number); g.fillRect(ox + c * k, oy + r * k, k, k); }); });
    // text, word by word at the browser's own layout positions (keeps Arabic shaping & RTL)
    const tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT); let n;
    while ((n = tw.nextNode())) { const t = n.nodeValue; if (!t.trim()) continue; const cs = getComputedStyle(n.parentElement);
      g.font = `${cs.fontWeight} ${parseFloat(cs.fontSize) * S}px ${cs.fontFamily}`; g.textBaseline = "middle"; g.textAlign = "center";
      const re = /\S+/g; let m; while ((m = re.exec(t))) { const rg = document.createRange(); rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
        const R = rg.getBoundingClientRect(); if (!R.width) continue; g.direction = /[؀-ۿ]/.test(m[0]) ? "rtl" : "ltr";
        g.fillText(m[0], (R.left + R.width / 2 - B.left) * S, (R.top + R.height / 2 - B.top) * S, R.width * S + 4); } }
    box.remove();
    // threshold → packed bits (1 = black)
    const px = g.getImageData(0, 0, dots, H).data, bpr = dots / 8, out = new Uint8Array(bpr * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < dots; x++) { const i = (y * dots + x) * 4; if (px[i] * .299 + px[i + 1] * .587 + px[i + 2] * .114 < 150) out[y * bpr + (x >> 3)] |= 0x80 >> (x & 7); }
    let s = ""; for (let i = 0; i < out.length; i += 8192) s += String.fromCharCode.apply(null, out.subarray(i, i + 8192));
    return {w: dots, h: H, b64: btoa(s)};
  },
  async send(body){
    const xml = `<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">${body}</epos-print></s:Body></s:Envelope>`;
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
    try { const r = await fetch(this.url(), {method: "POST", headers: {"Content-Type": "text/xml; charset=utf-8", "If-Modified-Since": "Thu, 01 Jan 1970 00:00:00 GMT", "SOAPAction": '""'}, body: xml, signal: ctl.signal});
      const t = await r.text(); if (!/success="true"/.test(t)) { const c = (t.match(/code="([^"]*)"/) || [])[1] || ("HTTP " + r.status); throw new Error(c); } return true;
    } finally { clearTimeout(tm); }
  },
  async print(html, opt = {}){
    const R = await this.raster(html);
    return this.send(`${opt.drawer ? `<pulse drawer="drawer_1" time="pulse_100"/>` : ""}<text align="center"/><image width="${R.w}" height="${R.h}" color="color_1" mode="mono">${R.b64}</image><feed line="3"/><cut type="feed"/>`);
  },
  why(e){ const m = String(e && e.message || e);
    if (/EPTR_COVER_OPEN|cover/i.test(m)) return "غطاء الطابعة مفتوح";
    if (/EPTR_REC_EMPTY|paper/i.test(m)) return "الورق خلص";
    if (/EX_ENPC_TIMEOUT|DeviceNotFound|SchemaError/i.test(m)) return "الطابعة ما ردّت (" + m + ")";
    return "ما وصلت للطابعة — تأكد إن الآيباد والطابعة على نفس الواي فاي وإن عنوان IP صحيح"; }
};

/* =====================================================================
   طابعات ESC/POS (رواء، CityPOS، Xprinter، وأغلب الطابعات الحرارية)
   الإيصال يُرسم صورة (العربي سليم) ويُحوّل لأوامر ESC/POS
   طرق الإرسال: ① USB مباشر من المتصفح (WebUSB — كروم)  ② تطبيق RawBT (أي أندرويد: USB/بلوتوث/واي فاي)
   ===================================================================== */
const ESC = {
  /* raster → ESC/POS bytes */
  async bytes(html, opt = {}){
    const R = await EP.raster(html), bpr = R.w / 8, bin = atob(R.b64), out = [];
    const push = (...a) => a.forEach(x => typeof x === "number" ? out.push(x) : out.push(...x));
    push([0x1B, 0x40]);                                     // ESC @  init
    if (opt.drawer) push([0x1B, 0x70, 0, 25, 250]);         // ESC p  open cash drawer (pin 2)
    for (let y0 = 0; y0 < R.h; y0 += 128) {                  // GS v 0 in bands (small printer buffers)
      const h = Math.min(128, R.h - y0);
      push([0x1D, 0x76, 0x30, 0, bpr & 255, bpr >> 8, h & 255, h >> 8]);
      for (let i = y0 * bpr; i < (y0 + h) * bpr; i++) out.push(bin.charCodeAt(i));
    }
    push([0x1B, 0x64, 4], [0x1D, 0x56, 66, 0]);              // feed 4 lines · partial cut
    return new Uint8Array(out);
  },
  b64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); },

  /* ---------- ① WebUSB ---------- */
  usbOK: () => !!(navigator.usb && navigator.usb.requestDevice),
  dev: null, ep: null,
  async pick(){                                              // must run from a button tap
    if (!this.usbOK()) throw new Error("NOUSB");
    const d = await navigator.usb.requestDevice({filters: []}); await this.attach(d);
    CFG.settings.printer.usbName = (d.manufacturerName || "") + " " + (d.productName || "") || "USB"; saveCfg(); return CFG.settings.printer.usbName;
  },
  async attach(d){
    if (!d.opened) await d.open();
    if (d.configuration === null) await d.selectConfiguration(1);
    const ifs = d.configuration.interfaces, alts = ifs.map(i => ({i, a: i.alternates[0]}));
    const hit = alts.find(x => x.a.interfaceClass === 7 && x.a.endpoints.some(e => e.direction === "out")) || alts.find(x => x.a.endpoints.some(e => e.direction === "out" && e.type === "bulk"));
    if (!hit) throw new Error("NOEP");
    try { await d.claimInterface(hit.i.interfaceNumber); } catch (e) { throw new Error("BUSY"); }
    this.dev = d; this.ep = hit.a.endpoints.find(e => e.direction === "out").endpointNumber;
  },
  async usbSend(u8){
    if (!this.dev || !this.dev.opened) { const L = this.usbOK() ? await navigator.usb.getDevices() : []; if (!L.length) throw new Error("NOPAIR"); await this.attach(L[0]); }
    for (let i = 0; i < u8.length; i += 16384) { const r = await this.dev.transferOut(this.ep, u8.subarray(i, i + 16384)); if (r.status !== "ok") throw new Error("USB " + r.status); }
  },

  /* ---------- ② RawBT bridge app ---------- */
  rawbt(u8){
    const url = "intent:base64," + this.b64(u8) + "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;";
    window.location.href = url;
  },

  async print(html, opt = {}){
    const u8 = await this.bytes(html, opt), P = CFG.settings.printer;
    if (P.mode === "rawbt") return this.rawbt(u8);
    return this.usbSend(u8);
  },
  why(e){ const m = String(e && e.message || e);
    if (m === "NOUSB") return "هذا المتصفح ما يدعم الطباعة بالـ USB — استخدم Chrome أو اختر طريقة تطبيق RawBT";
    if (m === "NOPAIR") return "ما فيه طابعة USB مربوطة — من الإعدادات اضغط «ربط الطابعة»";
    if (m === "BUSY") return "الطابعة مشغولة بتطبيق ثاني — سكّر التطبيق أو افصل الكيبل وركّبه";
    if (m === "NOEP") return "الجهاز اللي اخترته مو طابعة";
    if (/NotFoundError|No device selected/i.test(m)) return "ما اخترت طابعة";
    return "ما وصلت للطابعة — تأكد من الكيبل والتشغيل (" + m + ")"; }
};

   বাংলা — واجهة العامل بالبنغالي + دليل المشروبات بالصور + الملاحظات الجاهزة
   ===================================================================== */
const BN = {

const PHOTOS = {};
async function loadPhotos(){ try { (await DB.all("photos")).forEach(p => PHOTOS[p.id] = p.data); } catch (e) {} }
function pickPhoto(itemId, done){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment");
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const img = new Image(), url = URL.createObjectURL(f);
    img.onload = async () => { const s = Math.min(1, 480 / Math.max(img.width, img.height)), cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); const data = cv.toDataURL("image/jpeg", .72);
      PHOTOS[itemId] = data; await DB.put("photos", {id: itemId, data}); toast("📷 انحفظت الصورة"); done && done(); };
    img.onerror = () => toast("الصورة ما انفتحت", 1); img.src = url; };
  inp.click();
}
const pic = (it, cls) => PHOTOS[it.id] ? `<img class="${cls || "ph"}" src="${PHOTOS[it.id]}" alt="">` : `<span class="ic">${it.icon || "☕"}</span>`;

const FX = {};

/* ---------- defaults / migration (keeps an existing setup intact) ---------- */
function migrate(){
  let ch = false;
  if (!CFG.loyalty) { CFG.loyalty = {on: true, need: 10, cats: ["hot", "cold", "tea"], maxFree: 0}; ch = true; }
  if (!CFG.osos) { CFG.osos = {on: true, pct: 15, needNum: true}; ch = true; }
  if (!CFG.stock) {
    const S = (name, unit, qty, min) => ({id: "s_" + uid(), name, unit, qty, min});
    const beans = S("بن إسبريسو", "جم", 2000, 500), milk = S("حليب", "مل", 10000, 2000), oat = S("حليب شوفان", "مل", 2000, 500), almond = S("حليب لوز", "مل", 2000, 500),
      hcup = S("أكواب حارة", "حبة", 200, 50), ccup = S("أكواب باردة", "حبة", 200, 50);
    CFG.stock = [beans, milk, oat, almond, hcup, ccup];
    const R = (a, b) => [{s: a, q: b}];
    const sized = (fn) => ({0: fn(0), 1: fn(1), 2: fn(2), "*": fn(1)});
    const hotMilk = [180, 240, 300], coldMilk = [150, 200, 250];
    CFG.items.forEach(i => {
      const n = i.name, hot = i.cat === "hot" || i.cat === "tea";
      if (/^(لاتيه|كابتشينو|فلات وايت|سبانش لاتيه)$/.test(n)) i.recipe = sized(k => [{s: beans.id, q: 18}, {s: milk.id, q: hotMilk[k]}, {s: hcup.id, q: 1}]);
      else if (/^آيس (لاتيه|سبانش لاتيه|موكا)$/.test(n)) i.recipe = sized(k => [{s: beans.id, q: 18}, {s: milk.id, q: coldMilk[k]}, {s: ccup.id, q: 1}]);
      else if (n === "أمريكانو") i.recipe = sized(k => [{s: beans.id, q: k === 2 ? 27 : 18}, {s: hcup.id, q: 1}]);
      else if (n === "آيس أمريكانو") i.recipe = sized(k => [{s: beans.id, q: k === 2 ? 27 : 18}, {s: ccup.id, q: 1}]);
      else if (n === "إسبريسو") i.recipe = {"*": R(beans.id, 18)};
      else if (n === "ماتشا لاتيه" || n === "هوت شوكلت") i.recipe = sized(k => [{s: milk.id, q: hotMilk[k]}, {s: hcup.id, q: 1}]);
      else if (hot && i.cat !== "sweet") i.recipe = {"*": R(hcup.id, 1)};
      else if (i.cat === "cold" || i.cat === "fresh" && n !== "مياه") i.recipe = {"*": R(ccup.id, 1)};
    });
    const g = CFG.groups.find(x => x.id === "milk"); if (g) g.choices.forEach(c => { if (c.n === "شوفان") c.recipe = [{s: oat.id, q: 200}, {s: milk.id, q: -200}]; if (c.n === "لوز") c.recipe = [{s: almond.id, q: 200}, {s: milk.id, q: -200}]; });
    const e = CFG.groups.find(x => x.id === "extra"); if (e) e.choices.forEach(c => { if (/شوت/.test(c.n)) c.recipe = [{s: beans.id, q: 18}]; });
    CFG.invlog = []; ch = true;
  }
  if (!CFG.invlog) { CFG.invlog = []; ch = true; }
  if (ch) saveCfg();
}

FX.loyaltyVoid = async o => {

  c.stamps = Math.max(0, c.stamps - o.loyalty.earned + o.loyalty.used); c.visits = Math.max(0, c.visits - 1); c.spent = r2(c.spent - o.total); if (o.reward) c.rewards = Math.max(0, c.rewards - 1);
  await DB.put("customers", c);
};

const stockOf = id => CFG.stock.find(s => s.id === id);
function usageOf(lines){
  const use = {}, add = (s, q) => { if (stockOf(s)) use[s] = r2((use[s] || 0) + q); };
  lines.forEach(l => { const it = CFG.items.find(i => i.id === l.itemId); if (!it || !it.recipe) return;
    const k = it.sizes.findIndex(s => s.n === l.size), rec = it.recipe[k >= 0 ? k : "*"] || it.recipe["*"] || [];
    rec.forEach(r => add(r.s, r.q * l.qty));
    const gs = it.groups.map(g => CFG.groups.find(x => x.id === g)).filter(Boolean);
    l.opts.forEach(o => { const ch = gs.flatMap(g => g.choices).find(c => c.n === o.n); (ch && ch.recipe || []).forEach(r => add(r.s, r.q * l.qty)); }); });
  return use;
}
function applyUse(use, sign){ Object.entries(use).forEach(([s, q]) => { const st = stockOf(s); if (st) st.qty = r2(st.qty - sign * q); }); saveCfg(); }
const lowStock = () => CFG.stock.filter(s => s.min > 0 && s.qty <= s.min);

function csv(name, rows){
  const s = "﻿" + rows.map(r => r.map(c => { const v = String(c ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([s], {type: "text/csv;charset=utf-8"})); a.download = `${CFG.settings.nameEn || "pos"} - ${name}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    ov.querySelector("#gok").onclick = () => { grab(); g.choices = g.choices.filter(c => c.n); if (!g.name || !g.choices.length) return toast("اكتب اسم المجموعة وخيار واحد على الأقل", 1); const k = CFG.groups.findIndex(x => x.id === g.id); if (k >= 0) CFG.groups[k] = g; else CFG.groups.push(g); saveCfg(); closeModal(ov); setGroups(); };
  };
  const ov = modal(""); draw();
}
function setUsers(){
  $("#sbody").innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">المستخدمين</h3><button class="btn ok sm" id="nu">+ كاشير جديد</button></div>
    ${CFG.users.some(u => (u.role === "manager" && u.pin === "1234") || (u.role === "cashier" && u.pin === "0000")) ? `<div class="note red" style="margin:10px 0">⚠️ فيه رموز دخول افتراضية — غيّرها الحين عشان ما يدخل أحد بدون إذن.</div>` : ""}
    ${CFG.users.map(u => `<div class="line"><span style="font-size:24px">${u.role === "manager" ? "⭐" : "👤"}</span><div class="info"><b>${esc(u.name)}</b><small>${u.role === "manager" ? "مدير — كل الصلاحيات" : "كاشير — بيع فقط"}</small></div><button class="btn sm" data-uu="${u.id}">تعديل</button></div>`).join("")}</div>`;
  $("#nu").onclick = () => userEditor({id: "u_" + uid(), name: "", role: "cashier", pin: ""}, true);
  $$("[data-uu]").forEach(b => b.onclick = () => userEditor({...CFG.users.find(u => u.id === b.dataset.uu)}, false));
}
function userEditor(u, isNew){
  const ov = modal(`<div class="mh"><b>${isNew ? "مستخدم جديد" : "تعديل " + esc(u.name)}</b><button class="x" data-close>×</button></div><div class="mb">
    <label class="f"><span>الاسم</span><input id="un" value="${esc(u.name)}"></label><label class="f"><span>الصلاحية</span><select id="ur"><option value="cashier" ${u.role === "cashier" ? "selected" : ""}>كاشير</option><option value="manager" ${u.role === "manager" ? "selected" : ""}>مدير</option></select></label>
    <label class="f"><span>رمز الدخول (٤ إلى ٦ أرقام)</span><input id="up" class="num" inputmode="numeric" value="" placeholder="${isNew ? "" : "اتركه فاضي لو ما تبي تغيّره"}"></label></div>
    <div class="mf">${isNew ? "" : `<button class="btn warn" id="udel">🗑️</button>`}<button class="btn" data-close>رجوع</button><button class="btn pri" id="uok">حفظ</button></div>`);
  const dl = ov.querySelector("#udel"); if (dl) dl.onclick = async () => { if (u.id === USER.id) return toast("ما تقدر تحذف نفسك", 1); if (u.role === "manager" && CFG.users.filter(x => x.role === "manager").length < 2) return toast("لازم يبقى مدير واحد على الأقل", 1); if (!(await confirmBox(`تحذف «${esc(u.name)}»؟`, "حذف", 1))) return; CFG.users = CFG.users.filter(x => x.id !== u.id); saveCfg(); closeModal(ov); setUsers(); };
  ov.querySelector("#uok").onclick = () => { const n = ov.querySelector("#un").value.trim(), r = ov.querySelector("#ur").value, p = ov.querySelector("#up").value.trim();
    if (!n) return toast("اكتب الاسم", 1); if ((isNew || p) && !/^\d{4,6}$/.test(p)) return toast("الرمز لازم يكون من ٤ إلى ٦ أرقام", 1);
    if (p && CFG.users.some(x => x.id !== u.id && x.pin === p)) return toast("هذا الرمز مستخدم لشخص ثاني — اختر رمز مختلف", 1);
    if (!isNew && u.role === "manager" && r !== "manager" && CFG.users.filter(x => x.role === "manager").length < 2) return toast("لازم يبقى مدير واحد على الأقل", 1);
    const k = CFG.users.findIndex(x => x.id === u.id), nu = {...u, name: n, role: r, pin: p || u.pin}; if (k >= 0) CFG.users[k] = nu; else CFG.users.push(nu); if (USER.id === nu.id) USER = nu; saveCfg(); closeModal(ov); toast("✅ انحفظ"); setUsers(); };
}
function setLoyal(){
  const L = CFG.loyalty, O = CFG.osos;
  $("#sbody").innerHTML = `<div class="card"><h3>🎁 بطاقة الولاء</h3><p style="color:var(--mut);margin-bottom:8px">العميل يعطي رقم جواله، وكل مشروب يجمع له ختم. لما يكمّل العدد ياخذ مشروب مجاني.</p>
      <label class="toggle"><input type="checkbox" id="lon" ${L.on ? "checked" : ""}> تفعيل بطاقة الولاء</label>
      <label class="f"><span>عدد المشروبات للحصول على مجاني</span><input class="num" id="lneed" inputmode="numeric" value="${L.need}"></label>
      <div class="grp"><h4>الأقسام اللي تجمع أختام</h4><div class="opts">${CFG.cats.map(c => `<button class="opt ${L.cats.includes(c.id) ? "on" : ""}" data-lc="${c.id}">${c.icon || ""} ${esc(c.name)}</button>`).join("")}</div></div>
      <label class="f"><span>أقصى قيمة للمشروب المجاني (٠ = بدون حد)</span><input class="num" id="lmax" inputmode="decimal" value="${L.maxFree}"></label>
      <button class="btn pri" id="lsave">حفظ</button>

    <div class="card"><h3>🎓 متدربي معهد أسس</h3>
      <label class="toggle"><input type="checkbox" id="oon" ${O.on ? "checked" : ""}> خصم للمتدربين</label>
      <label class="f"><span>نسبة الخصم ٪</span><input class="num" id="opct" inputmode="decimal" value="${O.pct}"></label>
      <label class="toggle"><input type="checkbox" id="oneed" ${O.needNum ? "checked" : ""}> لازم يكتب الكاشير الرقم التدريبي</label>
      <button class="btn pri" id="osave">حفظ</button></div>`;
  $$("[data-lc]").forEach(b => b.onclick = () => b.classList.toggle("on"));
  $("#lsave").onclick = () => { const n = parseInt($("#lneed").value); if (!(n >= 2 && n <= 50)) return toast("العدد من ٢ إلى ٥٠", 1);
    Object.assign(L, {on: $("#lon").checked, need: n, cats: $$("[data-lc].on").map(b => b.dataset.lc), maxFree: r2(parseFloat($("#lmax").value) || 0)}); saveCfg(); toast("✅ انحفظ"); };
  $("#osave").onclick = () => { const p = parseFloat($("#opct").value); if (!(p >= 0 && p <= 100)) return toast("نسبة غير صحيحة", 1); Object.assign(O, {on: $("#oon").checked, pct: r2(p), needNum: $("#oneed").checked}); saveCfg(); toast("✅ انحفظ"); };
  DB.all("customers").then(C => { C.sort((a, b) => b.spent - a.spent); $("#ltop").innerHTML = C.length ? `<h4>أفضل العملاء (${C.length} عميل)</h4><table class="t"><tr><th>العميل</th><th>الزيارات</th><th>الأختام</th><th>المشتريات</th></tr>${C.slice(0, 15).map(c => `<tr><td>${esc(c.name || "—")}<br><small class="num" style="color:var(--mut)">${esc(c.phone)}</small></td><td class="num">${c.visits}</td><td class="num">${c.stamps}</td><td class="num">${m2(c.spent)}</td></tr>`).join("")}</table>` : ""; });
}
function setPrint(){
  const S = S$(), V = S.vat, P = S.printer;
  $("#sbody").innerHTML = `<div class="card"><h3>🖨️ الطباعة</h3><label class="f"><span>عرض ورق الطابعة</span><select id="pw"><option value="80" ${S.paper === 80 ? "selected" : ""}>٨٠ مم (الأشهر)</option><option value="58" ${S.paper === 58 ? "selected" : ""}>٥٨ مم</option></select></label>
      <label class="toggle"><input type="checkbox" id="pa" ${S.autoPrint ? "checked" : ""}> اطبع الإيصال تلقائياً بعد كل دفع</label><label class="toggle"><input type="checkbox" id="pt" ${S.autoTicket ? "checked" : ""}> اطبع تذكرة الباريستا تلقائياً</label><label class="toggle"><input type="checkbox" id="ptb" ${S.ticketBN !== false ? "checked" : ""}> تذكرة الباريستا بالعربي + البنغالي (বাংলা)</label>
      <div class="note" style="margin-top:10px">💡 الطباعة تمر عبر نافذة الطباعة في الجهاز. على <b>ويندوز</b>: عرّف الطابعة الحرارية واجعلها الطابعة الافتراضية، وفعّل من إعدادات تعريفها «فتح درج الكاش عند الطباعة». على <b>الآيباد</b>: تحتاج طابعة تدعم الطباعة عبر الشبكة (AirPrint) — طابعات USB ما تشتغل مع الآيباد.</div>
      <h4 style="margin:16px 0 8px">طريقة الاتصال بالطابعة</h4>
      <div class="opts" id="pmode">${[["usb", "🔌 USB مباشر (Chrome)"], ["rawbt", "📱 تطبيق RawBT (أندرويد)"], ["system", "🖨️ نافذة الطباعة (AirPrint / ويندوز)"], ["epson", "📶 Epson عبر IP"]].map(([k, t]) => `<button class="opt ${(P.mode || "system") === k ? "on" : ""}" data-pm2="${k}">${t}</button>`).join("")}</div>
      <div id="usbbox" class="pbx" data-for="usb" style="${P.mode === "usb" ? "" : "display:none"}">
        <div class="note" style="font-size:13.5px">لطابعات <b>رواء وCityPOS وXprinter</b> وأي طابعة ESC/POS. وصّل الطابعة بالتابلت بكيبل <b>USB-OTG</b>، وافتح الكاشير من متصفح <b>Chrome</b>، واضغط «ربط الطابعة» واختر الطابعة من القائمة. تربطها مرة وحدة بس.</div>
        <div class="row" style="margin-top:8px"><button class="btn" id="upick">🔗 ربط الطابعة</button><span id="uname" style="color:var(--mut)">${P.usbName ? "✅ مربوطة: " + esc(P.usbName) : ESC.usbOK() ? "ما فيه طابعة مربوطة" : "⚠️ هذا المتصفح ما يدعم USB — افتح الكاشير من Chrome"}</span></div></div>
      <div class="pbx" data-for="rawbt" style="${P.mode === "rawbt" ? "" : "display:none"}">
        <div class="note" style="font-size:13.5px">إذا ما عندك Chrome: نزّل تطبيق <b>RawBT</b> على التابلت، وافتح التطبيق وعرّف فيه طابعتك (USB أو بلوتوث أو واي فاي بعنوان IP)، وفعّل من إعداداته <b>Auto print / بدون تأكيد</b>. بعدها كل إيصال من الكاشير يروح للتطبيق ويطبع.</div></div>
      <label class="toggle pbx" data-for="usb rawbt epson" style="${["usb", "rawbt", "epson"].includes(P.mode) ? "" : "display:none"}"><input type="checkbox" id="pdr" ${P.drawer ? "checked" : ""}> افتح درج الكاش تلقائياً مع إيصالات الكاش</label>
      <div id="epbox" class="pbx" data-for="epson" style="${P.mode === "epson" ? "" : "display:none"}">
        <div class="row"><label class="f grow"><span>عنوان IP الطابعة</span><input id="pip" class="num" dir="ltr" inputmode="decimal" placeholder="192.168.1.50" value="${esc(P.ip || "")}"></label><label class="f" style="width:110px"><span>المنفذ (اختياري)</span><input id="pport" class="num" dir="ltr" inputmode="numeric" placeholder="تلقائي" value="${esc(P.port || "")}"></label></div>
        <div class="note" style="font-size:13.5px">📌 <b>أول مرة فقط:</b> اضغط «افتح صفحة الطابعة»، وإذا طلع تحذير أمان اضغط «إظهار التفاصيل ← زيارة الموقع» (هذا طبيعي لأن الطابعة داخل محلك)، ثم ارجع هنا واضغط «طباعة تجريبية».<br>عنوان IP يطلع في ورقة تطبعها الطابعة لما تضغط زر الـ Feed مع تشغيلها.</div>
        <div class="row" style="margin-top:8px"><button class="btn" id="popen">🌐 افتح صفحة الطابعة</button></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="ptest">🧪 طباعة تجريبية</button><button class="btn pri" id="psave">حفظ</button></div></div>
    <div class="card"><h3>🧾 ضريبة القيمة المضافة</h3>
      <div class="note ${V.on ? "green" : ""}">${V.on ? `✅ الضريبة مفعّلة — الأسعار شاملة الضريبة ${V.rate}٪، والإيصال يطلع «فاتورة ضريبية مبسطة» مع رمز QR حسب متطلبات هيئة الزكاة (المرحلة الأولى).` : `الضريبة <b>موقوفة</b> — الإيصال يطلع «إيصال بيع» بدون ضريبة. <b>لا تفعّلها إلا بعد تسجيلك رسمياً في ضريبة القيمة المضافة</b>، لأن غير المسجّل ما يحق له يحصّل ضريبة.`}</div>
      <label class="toggle" style="margin-top:10px"><input type="checkbox" id="von" ${V.on ? "checked" : ""}> المقهى مسجّل في الضريبة — فعّل الضريبة</label>
      <label class="f"><span>الرقم الضريبي (١٥ رقم يبدأ وينتهي بـ ٣)</span><input id="vno" class="num" inputmode="numeric" value="${esc(V.number)}" maxlength="15"></label>
      <div class="note red" style="font-size:13.5px">⚠️ إذا وصلك من هيئة الزكاة إشعار «مرحلة الربط والتكامل» (المرحلة الثانية)، تحتاج ربط مباشر مع منصة «فاتورة» — هذا غير مشمول هنا ويحتاج تطوير إضافي.</div>
      <button class="btn pri" id="vsave" style="margin-top:10px">حفظ إعدادات الضريبة</button></div>`;
  let mode = P.mode || "system";
  $$("[data-pm2]").forEach(b => b.onclick = () => { mode = b.dataset.pm2; $$("[data-pm2]").forEach(x => x.classList.toggle("on", x === b)); $$(".pbx").forEach(x => x.style.display = x.dataset.for.split(" ").includes(mode) ? "" : "none"); });
  $("#upick").onclick = async () => { try { const n = await ESC.pick(); $("#uname").textContent = "✅ مربوطة: " + n; toast("✅ انربطت الطابعة"); } catch (e) { toast(ESC.why(e), 1); } };
  const grabP = () => { const ip = $("#pip").value.trim(), port = $("#pport").value.trim();
    if (mode === "epson" && !/^(\d{1,3}\.){3}\d{1,3}$/.test(ip)) { toast("اكتب عنوان IP صحيح مثل 192.168.1.50", 1); return false; }
    if (port && !/^\d{2,5}$/.test(port)) { toast("المنفذ أرقام فقط", 1); return false; }
    S.paper = +$("#pw").value; S.autoPrint = $("#pa").checked; S.autoTicket = $("#pt").checked; S.ticketBN = $("#ptb").checked; Object.assign(P, {mode, ip, port, drawer: $("#pdr").checked}); saveCfg(); return true; };
  $("#popen").onclick = () => { const ip = $("#pip").value.trim(); if (!ip) return toast("اكتب عنوان IP أول", 1); window.open(`${location.protocol === "https:" ? "https" : "http"}://${ip}${$("#pport").value.trim() ? ":" + $("#pport").value.trim() : ""}/`, "_blank"); };
  $("#psave").onclick = () => { if (grabP()) toast("✅ انحفظ"); };
  $("#ptest").onclick = () => grabP() && printDoc(`<div class="rcpt ${+$("#pw").value === 58 ? "w58" : ""}"><div class="c"><h2>${esc(S.name)}</h2><div>طباعة تجريبية ✓</div><div class="num">${fmtDT(new Date().toISOString())}</div></div><div class="hr"></div><div class="c">إذا ظهر هذا الإيصال كامل وواضح، الطابعة جاهزة</div></div>`);
  $("#vsave").onclick = async () => { const on = $("#von").checked, no = $("#vno").value.trim();
    if (on && !/^3\d{13}3$/.test(no)) return toast("الرقم الضريبي لازم يكون ١٥ رقم يبدأ بـ 3 وينتهي بـ 3", 1);
    if (on && !V.on && !(await confirmBox("تأكد إن المقهى مسجّل فعلياً في ضريبة القيمة المضافة.<br>من الحين الأسعار تعتبر شاملة الضريبة والإيصال يصير فاتورة ضريبية مبسطة.", "نعم، مسجّل"))) return;
    V.on = on; V.number = no; saveCfg(); toast("✅ انحفظ"); setPrint(); };
}
function setData(){
  $("#sbody").innerHTML = `<div class="card"><h3>💾 النسخ الاحتياطي</h3><p style="color:var(--mut);margin-bottom:10px">البيانات محفوظة على هذا الجهاز فقط. صدّر نسخة احتياطية بشكل دوري (يُفضّل أسبوعياً) واحفظها في مكان آمن — لو انمسح المتصفح أو ضاع الجهاز تسترجع منها.</p>
      <div class="row"><button class="btn pri" id="bk">⬇️ تنزيل نسخة احتياطية كاملة</button><label class="btn">⬆️ استرجاع نسخة<input type="file" id="rs" accept=".json,application/json" hidden></label></div></div>
    <div class="card"><h3>⚠️ منطقة الخطر</h3><div class="row"><button class="btn warn" id="wipe">مسح كل المبيعات</button><button class="btn warn" id="reset">إرجاع المنيو والإعدادات للأصل</button></div></div>`;
  $("#bk").onclick = async () => { const data = {app: "coffee-doffee-pos", v: 1, at: new Date().toISOString(), cfg: CFG, orders: await DB.all("orders"), shifts: await DB.all("shifts")};
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"})); a.download = `coffee-doffee-backup-${dayOf()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("✅ تنزّلت النسخة"); };
  $("#rs").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (d.app !== "coffee-doffee-pos" || !d.cfg) throw 0;
      if (!(await confirmBox(`تسترجع نسخة ${fmtDT(d.at)}؟<br>فيها ${d.orders.length} طلب. الطلبات الحالية تُدمج معها.`, "استرجاع"))) return;
      CFG = d.cfg; saveCfg(); for (const o of d.orders) await DB.put("orders", o); for (const s of d.shifts || []) await DB.put("shifts", s); toast("✅ انسترجعت النسخة"); USER = null; render(); } catch (x) { toast("الملف غير صالح", 1); } };
  $("#wipe").onclick = async () => { if (!(await confirmBox("تمسح <b>كل</b> الطلبات والورديات من هذا الجهاز؟ ما يمكن التراجع. نزّل نسخة احتياطية قبل.", "مسح نهائي", 1))) return; await DB.clear("orders"); await DB.clear("shifts"); CFG.shift = null; CFG.seq = {day: "", n: 0}; CFG.serial = 0; saveCfg(); toast("انمسحت المبيعات"); USER = null; render(); };
  $("#reset").onclick = async () => { if (!(await confirmBox("ترجع المنيو والإعدادات والمستخدمين للأصل؟ (المبيعات تبقى)", "إرجاع", 1))) return; const sh = CFG.shift, seq = CFG.seq, serial = CFG.serial; CFG = seed(); CFG.shift = sh; CFG.seq = seq; CFG.serial = serial; saveCfg(); USER = null; render(); };
}

/* ---------------- boot ---------------- */
(async () => {
  await DB.open(); migrate(); await loadPhotos();
  if (/[?&]owner\b/.test(location.search)) return ownerApp();
  render(); CL.start();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude|localhost:877/.test(location.host)) navigator.serviceWorker.register("doffee-sw.js", {scope: location.pathname}).catch(() => {});
})();
