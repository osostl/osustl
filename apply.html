<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقديم على المعهد · معهد أسس التقنية والقانون العالي للتدريب</title>
<meta name="description" content="قدّم طلب التحاقك بمعهد أسس التقنية والقانون العالي للتدريب أونلاين، وتابع حالة طلبك.">
<meta property="og:title" content="التقديم على معهد أسس التقنية والقانون العالي للتدريب">
<meta property="og:description" content="قدّم طلب التحاقك أونلاين وارفع مستنداتك، وتابع حالة طلبك.">
<meta property="og:image" content="icon-512.png">
<meta property="og:locale" content="ar_SA">
<link rel="icon" href="logo-mark.png">
<meta name="theme-color" content="#1F5136">
<script>try{if(localStorage.getItem("asasTheme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1F5136;--green-2:#2C6B4A;--gold:#C9A54C;--gold-pale:#FBF4E2;--ink:#1D2621;--muted:#5E6B64;--line:#DCE3DE;--bg:#F3F5F2;--card:#FFFFFF;--ok:#1E7B46;--ok-bg:#E3F3E8;--abs:#B3261E;--abs-bg:#FBE4E2;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;color-scheme:light}
[data-theme=dark]{--ink:#E6EDE8;--muted:#A3B2AA;--line:#2E3B34;--bg:#121A16;--card:#1A241F;--gold-pale:#2A2516;--ok-bg:#16301F;--abs-bg:#3A1C1A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7}
header{background:var(--green);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px;justify-content:center}
header img{width:48px;height:48px;border-radius:10px;background:#fff;padding:4px}
header h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
header span{display:block;font-size:13px;opacity:.85}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-family:var(--display);color:var(--green);font-weight:600;margin:0 0 6px;font-size:21px}
[data-theme=dark] h2{color:#7FC79F}
.muted{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.prog{display:grid;gap:8px}
.prog label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600}
.prog label:has(input:checked){border-color:var(--green);background:var(--ok-bg)}
.prog input{width:auto;margin-top:6px}
.prog small{display:block;font-weight:400;color:var(--muted)}
.btn{font:inherit;font-weight:700;padding:13px 22px;border-radius:12px;border:0;background:var(--green);color:#fff;cursor:pointer;width:100%;font-size:17px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;background:var(--gold);color:#1D2621}
.notice{padding:12px 14px;border-radius:12px;background:var(--gold-pale);border:1px solid var(--gold);margin-bottom:14px}
.notice.err{background:var(--abs-bg);border-color:var(--abs);color:var(--abs)}
.notice.ok{background:var(--ok-bg);border-color:var(--ok)}
.ref{font-size:34px;font-weight:700;letter-spacing:3px;color:var(--green);direction:ltr;text-align:center;margin:8px 0}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}.chk input{width:auto;margin-top:6px}
.files .f input{padding:8px}
.steps3{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.steps3 div{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14.5px}
@media(max-width:560px){.steps3 div{flex-direction:column;text-align:center;font-size:12.5px;padding:8px 6px;gap:4px}}
.steps3 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.filt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{font:inherit;font-weight:700;border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--green);color:#fff}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}.sec h2{margin:0}.sec span{color:var(--muted);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:right;font:inherit;color:inherit;width:100%}
.pc:hover,.pc:focus-visible{border-color:var(--gold);box-shadow:0 6px 18px rgba(31,81,54,.08);outline:none}
.ico{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#FFFBF0,#F6E6B8);border:1px solid #EAD59A;display:grid;place-items:center;flex:none}
.ico svg{width:30px;height:30px;stroke:#1F5136;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico svg .g{stroke:#B08A2E}
[data-theme=dark] .ico{background:linear-gradient(145deg,#2A2516,#3A3014);border-color:#5A4A20}[data-theme=dark] .ico svg{stroke:#9ED6B4}
.pc .bd{flex:1;min-width:0}.pc h3{margin:0 0 4px;font-size:16.5px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px;color:var(--muted)}.meta b{color:var(--ink);font-weight:700}
.gp{font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}.gp.m{color:#1F5136;background:#E8F3EC}.gp.f{color:#8A2D5C;background:#FBEAF2}.gp.mf{color:#7A5A12;background:#FBF0D6}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--abs-bg);color:var(--abs)}
.go{color:var(--gold);font-size:22px;align-self:center;flex:none}
.sheet{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:12px}
.sheet .in{background:var(--card);border-radius:22px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:20px}
@media(min-width:700px){.sheet{align-items:center}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.facts div{background:var(--bg);border-radius:12px;padding:9px 12px}.facts span{display:block;font-size:12px;color:var(--muted)}.facts b{font-size:15px}
.sheet ul{margin:4px 0 10px;padding-inline-start:20px;line-height:1.9}
.chosen{display:flex;gap:12px;align-items:center;border:1.5px solid var(--green);background:var(--ok-bg);border-radius:16px;padding:12px}
.linkb{font:inherit;color:var(--green);font-weight:700;background:none;border:0;cursor:pointer;text-decoration:underline}
.ghead{font-family:var(--display);color:var(--green);font-size:15px;margin:10px 0 4px}
footer{text-align:center;padding:20px;color:var(--muted);font-size:13px}
footer a{color:var(--green)}
</style>
</head>
<body>
<header><img src="logo-mark.png" alt=""><div><h1>معهد أسس التقنية والقانون العالي للتدريب</h1><span>البرامج والتسجيل</span></div></header>
<main>
  <div class="tabs"><button class="tab on" data-t="programs">البرامج</button><button class="tab" data-t="apply">تقديم طلب</button><button class="tab" data-t="track">متابعة طلبي</button></div>
  <div id="view"><div class="card muted">جاري التحميل…</div></div>
</main>
<footer><a href="./">البوابة الإلكترونية للمعهد</a></footer>
<script>
"use strict";
const PROJECT = "osostl-attendance";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");
const Q = new URLSearchParams(location.search);
let API = "", CFG = null, TAB = Q.get("ref") || Q.has("track") ? "track" : Q.has("apply") ? "apply" : "programs", T0 = Date.now(), PRE = Q.get("p") || "", CAT = "all", GEN = "all", OPEN = {};
const CATS = {diploma: ["الدبلومات", "🎓"], qual: ["البرامج التأهيلية", "🎯"], dev: ["البرامج التطويرية", "📈"]}, GENS = {m: "رجالي", f: "نسائي", mf: "رجالي ونسائي"};
const money = v => /^\d+(\.\d+)?$/.test(String(v || "").trim()) ? Number(v).toLocaleString("en-US") + " ر.س" : String(v || "");
let MREF = ""; try { MREF = (Q.get("m") || sessionStorage.getItem("asasM") || "").slice(0, 60); if (MREF) sessionStorage.setItem("asasM", MREF); } catch {}
const DOCN = {id: "الهوية الوطنية", cert: "شهادة الثانوية العامة (معتمدة من نور)", photo: "صورة شخصية"};
const DOCH = {id: "صورة واضحة للوجهين، أو PDF", cert: "اطبعها PDF من موقع نظام نور (noor.moe.gov.sa)", photo: ""};
const ERR = {closed: "التقديم مقفل حالياً.", name: "اكتب اسمك الثلاثي أو الرباعي.", nid: "رقم الهوية لازم 10 أرقام ويبدأ بـ 1 أو 2.", phone: "رقم الجوال لازم يبدأ بـ 05 ويكون 10 أرقام.", email: "البريد الإلكتروني غير صحيح.",
  missing: "كمّل الخانات المطلوبة (*).", program: "اختر البرنامج.", filetype: "المرفقات لازم تكون صورة أو PDF.", filesize: "حجم المرفق كبير، الحد 5 ميجا للملف.", limit: "وصلت الحد اليومي من هذا الجهاز. حاول بكرة أو تواصل معنا.",
  upload: "تعذّر رفع المرفقات الحين. حاول بعد شوي.", docs: "ارفع المستندات المطلوبة (*).", pledgename: "اكتب اسمك الكامل مثل ما هو في طلبك بالضبط، وأشّر على الموافقة.", "bad request": "صار خطأ في الإرسال. حدّث الصفحة وحاول مرة ثانية.", missingRef: "ما لقينا طلب بهذا الرقم والهوية. تأكد من البيانات."};
const api = async body => { const r = await fetch(API + "/apply", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)}); const j = await r.json().catch(() => ({})); return {r, j}; };
async function boot(){
  try {
    const r = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/public/site`);
    const j = await r.json(); API = (((j.fields || {}).pushUrl || {}).stringValue || "").replace(/\/+$/, "");
    if (!API) throw new Error("no api");
    CFG = await (await fetch(API + "/apply")).json();
  } catch (e) { console.error(e); $("#view").innerHTML = `<div class="notice err">تعذّر تحميل الصفحة. تأكد من الاتصال وحدّث الصفحة.</div>`; return; }
  draw();
}
function draw(){
  document.querySelectorAll("[data-t]").forEach(b => { b.classList.toggle("on", b.dataset.t === TAB); b.onclick = () => { TAB = b.dataset.t; draw(); }; });
  TAB === "track" ? drawTrack() : TAB === "apply" ? drawApply() : drawPrograms();
}
// line icons in the site's green and gold, picked from the program's name, then its category
const SV = {
  cap: '<path d="M3 9.5 12 5l9 4.5-9 4.5z"/><path class="g" d="M7 11.6V15c0 1.3 2.2 2.6 5 2.6s5-1.3 5-2.6v-3.4"/><path class="g" d="M21 9.5v5"/>',
  law: '<path d="M12 4v15M8 19h8"/><path class="g" d="M5 7h14M7 7l-3 6h6zM17 7l-3 6h6z"/>',
  media: '<rect x="3" y="7" width="13" height="10" rx="2"/><path class="g" d="m16 10.5 5-3v9l-5-3"/><circle class="g" cx="9.5" cy="12" r="2.2"/>',
  shield: '<path d="M12 3.5 5 6.5v5c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9v-5z"/><path class="g" d="m9 12 2.2 2.2L15.5 10"/>',
  lang: '<path d="M4 5.5h7a2 2 0 0 1 2 2V19a2 2 0 0 0-2-2H4z"/><path d="M20 5.5h-5a2 2 0 0 0-2 2V19a2 2 0 0 1 2-2h5z"/><path class="g" d="M6.5 9h3M6.5 12h3M15.5 9h2M15.5 12h2"/>',
  step: '<rect x="5" y="3.5" width="14" height="17" rx="2"/><path class="g" d="M8.5 8h7M8.5 11.5h7"/><path d="m9 16 1.8 1.6L15 14"/>',
  mind: '<circle cx="12" cy="12" r="8"/><circle class="g" cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2"/><path class="g" d="M18 6l3-3M18 3.5V6h2.5"/>',
  cert: '<circle cx="12" cy="9.5" r="5"/><path class="g" d="m9.3 13.7-1.6 6.8 4.3-2.3 4.3 2.3-1.6-6.8"/><path d="m10.2 9.6 1.3 1.3 2.4-2.6"/>',
  keys: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path class="g" d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M6 12.5h.01M18 12.5h.01"/><path d="M8.5 15h7"/>',
  gavel: '<path d="m13.5 5.5 5 5M11 8l5 5M9.6 9.4l4.9-4.9 5 5-4.9 4.9z"/><path class="g" d="M12.2 12 4.5 19.7M3.5 21h8"/>',
  grow: '<path d="M4 19h16"/><path class="g" d="M6.5 15.5l4-4 3 3 5-6"/><path d="M15 8.5h3.5V12"/>'};
const icoOf = p => { const n = p.name || "";
  const k = /إعلام/.test(n) ? "media" : /قانون/.test(n) && p.cat === "diploma" ? "law" : /سيبر|سبر|أمن/.test(n) ? "shield" : /STEP/i.test(n) && /تأسيس/.test(n) ? "lang" : /STEP/i.test(n) ? "step"
    : /قدرات/.test(n) ? "mind" : /GRCP|شهادة المهنية|حوكمة/i.test(n) ? "cert" : /إدخال|معالجة النصوص|بيانات/.test(n) ? "keys" : /تنفيذ|قضا|نظام/.test(n) ? "gavel" : /إنجليز|لغة/.test(n) ? "lang" : p.cat === "diploma" ? "cap" : p.cat === "qual" ? "cert" : "grow";
  return `<div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">${SV[k]}</svg></div>`; };
function drawPrograms(){
  const all = (CFG.programs || []).filter(p => GEN === "all" || p.gender === GEN || p.gender === "mf");
  if (!(CFG.programs || []).length) { $("#view").innerHTML = `<div class="card"><h2>البرامج</h2><p class="muted">تُعلن البرامج قريباً.</p></div>`; return; }
  $("#view").innerHTML = `${CFG.open ? `<div class="steps3"><div><i>1</i>اختر البرنامج</div><div><i>2</i>عبّي بياناتك</div><div><i>3</i>تابع طلبك برقم الطلب</div></div>` : `<div class="notice">${esc(CFG.msg || "التقديم مقفل حالياً، تقدر تطّلع على البرامج وتفاصيلها.")}</div>`}
    <div class="filt"><div class="seg">${[["all", "الكل"], ["diploma", "الدبلومات"], ["qual", "التأهيلية"], ["dev", "التطويرية"]].filter(([k]) => k === "all" || (CFG.programs || []).some(p => p.cat === k)).map(([k, v]) => `<button class="${CAT === k ? "on" : ""}" data-c="${k}">${v}</button>`).join("")}</div>
      <div class="seg">${[["all", "للجميع"], ["m", "رجال"], ["f", "نساء"]].map(([k, v]) => `<button class="${GEN === k ? "on" : ""}" data-g="${k}">${v}</button>`).join("")}</div></div>
    ${Object.keys(CATS).filter(c => CAT === "all" || CAT === c).map(c => { const l = all.filter(p => p.cat === c); return l.length ? `<div class="sec"><h2>${CATS[c][0]}</h2><span>${l.length} ${l.length > 10 || l.length < 3 ? "برنامج" : "برامج"}</span></div><div class="pgrid">${l.map(card).join("")}</div>` : ""; }).join("") || `<div class="card muted">ما فيه برامج بهذا الاختيار.</div>`}
    <div class="card" style="margin-top:18px;display:flex;gap:14px;align-items:flex-start"><div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z"/><path class="g" d="M14 3.5V8h4M9.5 12h6M9.5 15h6"/></svg></div>
      <div><h2 style="margin:0 0 6px">متطلبات التسجيل</h2><div class="muted" style="margin-bottom:6px">حسب متطلبات المؤسسة العامة للتدريب التقني والمهني</div>
      <ul style="margin:0;padding-inline-start:20px;line-height:2"><li><b>الهوية الوطنية</b> (صورة واضحة أو PDF)</li><li><b>شهادة الثانوية العامة معتمدة من نظام نور</b> (تطبعها PDF من موقع نور)</li><li>صورة شخصية عند الحاجة</li></ul></div></div>`;
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { CAT = b.dataset.c; drawPrograms(); });
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { GEN = b.dataset.g; drawPrograms(); });
  document.querySelectorAll("[data-pid]").forEach(b => b.onclick = () => sheet(b.dataset.pid));
}
function card(p){
  const tag = !p.apply ? `<span class="tag">التقديم مغلق</span>` : p.full ? `<span class="tag">قائمة انتظار</span>` : p.left !== null && p.left <= 10 ? `<span class="tag">باقي ${p.left} مقعد</span>` : "";
  return `<button class="pc" data-pid="${esc(p.id)}">${icoOf(p)}<div class="bd"><h3>${esc(p.name)}</h3>
    <div class="meta"><span class="gp ${p.gender}">${GENS[p.gender] || ""}</span>${p.duration ? `<span>⏱ <b>${esc(p.duration)}</b></span>` : ""}${p.fees ? `<span><b>${esc(money(p.fees))}</b></span>` : ""}${tag}</div></div><span class="go">‹</span></button>`;
}
function sheet(id){
  const p = (CFG.programs || []).find(x => x.id === id); if (!p) return;
  const out = String(p.outline || "").split("\n").map(x => x.trim()).filter(Boolean);
  const facts = [["المدة", p.duration], ["الساعات", p.hours ? p.hours + (/^\d+(\.\d+)?$/.test(p.hours) ? " ساعة" : "") : ""], ["الرسوم", money(p.fees)], ["نمط التدريب", p.mode], ["تبدأ", p.start], ["الفئة", GENS[p.gender]]].filter(([, v]) => v);
  const d = document.createElement("div"); d.className = "sheet";
  d.innerHTML = `<div class="in" role="dialog" aria-modal="true"><div style="display:flex;gap:12px;align-items:center">${icoOf(p)}<h2 style="margin:0;flex:1">${esc(p.name)}</h2><button class="linkb" data-x style="text-decoration:none;font-size:22px">✕</button></div>
    <p style="margin:12px 0 0">${esc(p.desc || p.note || "")}</p>
    <div class="facts">${facts.map(([k, v]) => `<div><span>${k}</span><b dir="auto">${esc(v)}</b></div>`).join("")}</div>
    ${p.audience ? `<p style="margin:0 0 8px"><b>لمن البرنامج؟</b> ${esc(p.audience)}</p>` : ""}
    ${out.length ? `<div class="ghead">محاور البرنامج</div><ul>${out.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}

    <div class="card"><h2>بياناتك</h2><div class="grid">
      <label class="f" style="grid-column:1/-1">الاسم الرباعي (كما في الهوية) *<input name="name" maxlength="80" autocomplete="name" required></label>

  $("#F").onsubmit = submit;

function shrink(file){   // photos are resized so a phone picture stays small; a PDF goes as it is
  return new Promise((ok, no) => {
    if (isPdf(file)) return ok(file);
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : no(new Error("img")), "image/jpeg", .82); };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error("filetype")); }; img.src = u;
  });
}
const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name || "");
function say(t, cls, el){ (el || $("#msg")).innerHTML = t ? `<div class="notice ${cls || "err"}" style="margin:0">${t}</div>` : ""; }
async function upload(root, btn){   // the picked files go straight to the institute server with tickets from the service
  const picks = [];
  for (const inp of root.querySelectorAll("[data-k]")) {
    const f = inp.files[0]; if (!f) continue;
    if (!isPdf(f) && !/^image\//.test(f.type)) throw new Error("filetype");
    const blob = await shrink(f); if (blob.size > 5 * 1024 * 1024) throw new Error("filesize");
    picks.push({kind: inp.dataset.k, type: isPdf(f) ? "application/pdf" : "image/jpeg", size: blob.size, blob});
  }
  if (!picks.length) return [];
  btn.textContent = "جاري رفع المستندات…";
  const {j: t} = await api({action: "files", files: picks.map(({kind, type, size}) => ({kind, type, size}))});
  if (!t.ok) throw new Error(t.error || "upload");
  const out = [];
  for (let i = 0; i < picks.length; i++) {
    const r = await fetch(t.files[i].url, {method: "PUT", body: picks[i].blob}).catch(() => null); if (!r || !r.ok) throw new Error("upload");
    out.push({kind: picks[i].kind, type: picks[i].type, size: picks[i].size, rid: t.files[i].rid, sig: t.files[i].sig});
  }
  return out;
}
async function submit(e){
  e.preventDefault();
  const fd = new FormData($("#F")), form = Object.fromEntries(fd.entries());
  form.name = String(form.name || "").replace(/\s+/g, " ").trim(); form.nid = digits(form.nid); form.phone = digits(form.phone); if (MREF) form.referral = MREF;
  if (!form.program) return say(ERR.program);
  if (form.name.split(" ").length < 3) return say(ERR.name);
  if (!/^[12]\d{9}$/.test(form.nid)) return say(ERR.nid);
  if (!/^(05\d{8}|5\d{8}|9665\d{8})$/.test(form.phone)) return say(ERR.phone);
  if (!form.gender || !form.city || !form.edu) return say(ERR.missing);
  const pr = (CFG.programs || []).find(p => p.id === form.program); if (pr && pr.gender !== "mf" && pr.gender !== form.gender) return say(`هذا البرنامج ${pr.gender === "m" ? "للرجال" : "للنساء"} فقط. اختر البرنامج المناسب لك.`);
  const lack = (CFG.docs || ["id", "cert"]).filter(k => !($(`[data-k="${k}"]`).files || [])[0]); if (lack.length) return say("ارفع: " + lack.map(k => DOCN[k]).join("، "));
  if (!$("#ok").checked) return say("لازم توافق على الإقرار قبل الإرسال.");

  try {
    const files = await upload($("#F"), btn); btn.textContent = "جاري الإرسال…";
    const hp = form.website; delete form.website;
    const {r, j} = await api({action: "submit", form, files, hp, ms: Date.now() - T0});
    if (j.error === "dup") { $("#view").innerHTML = `<div class="card"><h2>عندك طلب سابق</h2><p>فيه طلب التحاق مفتوح بنفس رقم الهوية، رقمه:</p><div class="ref">${esc(j.ref)}</div><p class="muted">تقدر تتابعه من «متابعة طلبي». ولو تبي تغيّر شي تواصل مع القبول والتسجيل.</p></div>`; return; }
    if (!r.ok || !j.ok) throw new Error(j.error || "failed");
    try { sessionStorage.removeItem("asasM"); } catch {}
    $("#view").innerHTML = `<div class="card" style="text-align:center"><div style="font-size:46px">✅</div><h2>وصلنا طلبك</h2><p>رقم طلبك:</p><div class="ref">${esc(j.ref)}</div>
      <button class="btn sm" id="cp">نسخ الرقم</button>${j.wait ? `<div class="notice" style="margin-top:12px">المقاعد في الدفعة الحالية مكتملة، وطلبك في <b>قائمة الانتظار</b>. بنتواصل معك أول ما يتوفر مقعد.</div>` : ""}
      <p class="muted">احتفظ بالرقم${form.email ? "، وأرسلناه لبريدك كمان" : ""}. بيتواصل معك قسم القبول والتسجيل، وتتابع حالة طلبك وتكمّل أي مستند ناقص من «متابعة طلبي» برقم الطلب ورقم هويتك.</p></div>`;
    $("#cp").onclick = () => navigator.clipboard.writeText(j.ref).then(() => { $("#cp").textContent = "انتسخ ✓"; }).catch(() => {});
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (x) { console.error(x); btn.disabled = false; btn.textContent = "إرسال الطلب"; say(ERR[x.message] || "تعذّر إرسال الطلب الحين. تأكد من الاتصال وحاول مرة ثانية."); }
}
const SAR = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("en-US") + " ر.س";
function drawTrack(){
  $("#view").innerHTML = `<form class="card" id="TF"><h2>متابعة طلب التحاق</h2><div class="grid">
      <label class="f">رقم الطلب<input name="ref" dir="ltr" maxlength="8" placeholder="A1B2C3D4" value="${esc(Q.get("ref") || "")}" style="text-transform:uppercase"></label>

async function look(ref, nid){
  const out = $("#tr"); out.innerHTML = `<div class="card muted">جاري البحث…</div>`;
  let j; try { j = (await api({action: "status", ref, nid})).j; } catch { out.innerHTML = `<div class="notice err">تعذّر الاتصال. حاول مرة ثانية.</div>`; return; }
  if (!j.ok) { out.innerHTML = `<div class="notice err">${ERR.missingRef}</div>`; return; }
  const cls = j.status === "enrolled" ? "ok" : j.status === "rejected" ? "err" : "", P = j.pledge;
  out.innerHTML = `<div class="card"><div class="notice ${cls}" style="margin:0"><b>${esc(j.name)}</b><br>البرنامج: ${esc(j.program)} · تاريخ التقديم: <span dir="ltr">${esc(j.at)}</span><br>الحالة: <b>${esc(j.label)}</b>${j.wait ? "<br>⏳ أنت في قائمة الانتظار" : ""}
      ${j.num ? `<br>رقمك الأكاديمي: <b dir="ltr">${esc(j.num)}</b> — بيوصلك رمز الدخول للبوابة من المعهد.` : ""}${j.pledged ? `<br>✍️ وافقت على الإقرار بتاريخ <span dir="ltr">${esc(j.pledged)}</span>` : ""}</div></div>
    ${j.docs.length ? `<form class="card files" id="DF"><h2>📎 مطلوب منك رفع</h2><div class="grid">${j.docs.map(d => fileIn(d.kind, true)).join("")}</div><div id="dmsg" style="margin-top:10px"></div><button class="btn" id="dgo" type="submit" style="margin-top:8px">رفع المستندات</button></form>` : ""}
    ${P ? `<form class="card" id="PF"><h2>✍️ الإقرار والتعهد</h2><p class="muted" style="margin-top:0">آخر خطوة قبل إصدار رقمك الأكاديمي: راجع رسومك وخطة السداد واقرأ الإقرار، ووافق عليه باسمك الكامل.</p>
      <div class="notice" style="margin:0 0 10px">البرنامج: <b>${esc(P.fin.program)}</b><br>الرسوم: ${SAR(P.fin.fee)}${P.fin.discount ? ` · الخصم: ${SAR(P.fin.discount)}` : ""} · <b>الصافي: ${SAR(P.fin.fee - P.fin.discount)}</b><br>خطة السداد: ${esc(P.fin.plan)}${P.fin.months && /شهري/.test(P.fin.plan) ? ` (${P.fin.months} أشهر)` : ""}${P.fin.start ? ` · أول قسط: <span dir="ltr">${esc(P.fin.start)}</span>` : ""}</div>
      <div style="white-space:pre-wrap;line-height:2;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto">${esc(P.text)}</div>
      <label class="f" style="margin-top:12px">اكتب اسمك الكامل كما في طلبك *<input name="pname" maxlength="80" autocomplete="off"></label>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="pok"> <span>قرأت الإقرار والتعهد والرسوم وخطة السداد، وأوافق عليها.</span></label>
      <div id="pmsg" style="margin-top:10px"></div><button class="btn" id="pgo" type="submit" style="margin-top:8px">أوافق وأوقّع</button></form>` : ""}`;
  if ($("#DF")) $("#DF").onsubmit = async e => { e.preventDefault(); const btn = $("#dgo"), m = $("#dmsg");
    if (![...$("#DF").querySelectorAll("[data-k]")].some(i => i.files[0])) return say("اختر الملف", "err", m);
    btn.disabled = true; try { const files = await upload($("#DF"), btn); const {j: r} = await api({action: "adddocs", ref, nid, files}); if (!r.ok) throw new Error(r.error || "upload"); look(ref, nid); }
    catch (x) { btn.disabled = false; btn.textContent = "رفع المستندات"; say(ERR[x.message] || "تعذّر الرفع، حاول مرة ثانية.", "err", m); } };
  if ($("#PF")) $("#PF").onsubmit = async e => { e.preventDefault(); const btn = $("#pgo"), m = $("#pmsg"), name = String(new FormData(e.target).get("pname") || "").replace(/\s+/g, " ").trim();
    if (!$("#pok").checked || name.split(" ").length < 3) return say(ERR.pledgename, "err", m);
    btn.disabled = true; btn.textContent = "جاري الحفظ…"; const {j: r} = await api({action: "pledge", ref, nid, name, agree: true}).catch(() => ({j: {}}));
    if (!r.ok) { btn.disabled = false; btn.textContent = "أوافق وأوقّع"; return say(ERR[r.error] || "تعذّر الحفظ، حاول مرة ثانية.", "err", m); } look(ref, nid); };
}
