<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر أسس السيبراني · OSOS Cyber Lab</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --panel:#111823; --panel2:#0d141d; --line:#1e2a38;
  --txt:#e6edf3; --mut:#8b9bb0; --red:#ff4d5e; --redd:#2a0f14;
  --grn:#3ddc84; --grnd:#0f2418; --cy:#36c5f0; --gold:#f2c14e;
  --vio:#a371f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans Arabic",sans-serif;line-height:1.7;min-height:100vh}
code,.mono,pre,input,textarea,.term{font-family:"JetBrains Mono",monospace}
a{color:var(--cy)}
.en{direction:ltr;text-align:left;display:block;font-family:"JetBrains Mono",monospace}
.hidden{display:none!important}

/* ---- top bar ---- */
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0d1420,#0a0e14);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--red),#b3303c);display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 0 18px rgba(255,77,94,.4)}
.logo b{font-size:17px;letter-spacing:.3px}
.logo span{font-size:11px;color:var(--mut);display:block;margin-top:-2px}
.hdr-spacer{flex:1}
.rank{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.rank .xp{font-size:12px;color:var(--mut)}
.rank b{color:var(--gold)}
.bar{height:7px;background:#1a2430;border-radius:20px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--cy));border-radius:20px;transition:width .5s}

/* ---- layout ---- */
.wrap{display:flex;gap:0;align-items:flex-start}
nav.side{width:300px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel2);min-height:calc(100vh - 64px);padding:16px 12px;position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto}
.lvl{margin-bottom:14px}
.lvl>h4{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center}
.lvl>h4 .en{font-size:10px}
.chal{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px;transition:.15s;border:1px solid transparent}
.chal:hover{background:#10202c}
.chal.active{background:#0e2230;border-color:#1c4257}
.chal .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:#162230;flex-shrink:0}
.chal .nm{flex:1}
.chal .nm small{display:block;font-size:10px;color:var(--mut)}
.chal .st{font-size:13px}
.chal.locked{opacity:.4;cursor:not-allowed}
.diffdot{width:7px;height:7px;border-radius:50%}
.d-easy{background:var(--grn)} .d-med{background:var(--gold)} .d-hard{background:var(--red)}

main{flex:1;padding:24px 30px;max-width:980px;min-height:calc(100vh - 64px)}

/* ---- home ---- */
.hero{background:radial-gradient(1200px 300px at 80% -40%,rgba(255,77,94,.14),transparent),linear-gradient(135deg,#0f1a26,#0b1118);border:1px solid var(--line);border-radius:18px;padding:30px 32px;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{font-size:27px;margin-bottom:6px}
.hero .en{font-size:14px;color:var(--mut);margin-bottom:14px}
.hero p{color:#c6d2df;max-width:640px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{background:#132130;border:1px solid var(--line);border-radius:30px;padding:5px 13px;font-size:12px;color:#aebccb}
.chip b{color:var(--grn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:#2a3f52;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .en{font-size:11px;color:var(--mut);margin-bottom:8px}
.card p{font-size:13px;color:#aab8c7}
.card .foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.secnote{background:var(--redd);border:1px solid #4a1820;border-radius:12px;padding:14px 18px;margin:20px 0;font-size:13px;color:#ffc9cf;display:flex;gap:12px;align-items:flex-start}
.secnote .en{color:#e79aa2;font-size:11px;margin-top:3px}

/* ---- challenge view ---- */
.cv-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.cv-head .big{width:52px;height:52px;border-radius:13px;background:#162230;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.cv-head h2{font-size:22px}
.cv-head .en{font-size:13px;color:var(--mut)}
.badges{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.b{font-size:11px;padding:3px 9px;border-radius:20px;background:#132130;border:1px solid var(--line);color:#aebccb}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:11px 15px;cursor:pointer;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.on{color:var(--txt);border-color:var(--red)}
.tab .done{color:var(--grn);font-size:12px}
.tab .en{font-size:9px;opacity:.7}

.pane{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.bl .en{font-size:12px;color:var(--mut);margin-top:8px;border-top:1px dashed #22303f;padding-top:8px}
.bl h4{margin-bottom:6px;color:var(--cy);font-size:15px}
.goal{border-right:3px solid var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.06),transparent)}

/* simulated browser */
.sim{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:#fff;color:#1a2230}
.sim .urlbar{background:#e9eef3;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #d6dde4}
.sim .dots{display:flex;gap:5px}.sim .dots i{width:11px;height:11px;border-radius:50%}
.sim .dots i:nth-child(1){background:#ff5f57}.sim .dots i:nth-child(2){background:#febc2e}.sim .dots i:nth-child(3){background:#28c840}
.sim .addr{flex:1;background:#fff;border:1px solid #d0d7de;border-radius:7px;padding:5px 11px;font-size:12px;color:#55606b;font-family:"JetBrains Mono",monospace;direction:ltr;text-align:left;cursor:text}
.sim .body{padding:22px;direction:ltr;text-align:left;min-height:120px}
.sim .sitehdr{display:flex;align-items:center;gap:10px;border-bottom:2px solid #eee;padding-bottom:12px;margin-bottom:16px}
.sim .sitehdr .lg{width:30px;height:30px;border-radius:7px;background:#2d6cdf;display:grid;place-items:center;color:#fff;font-weight:700}
.sim .sitehdr b{font-size:16px;color:#1a2230}
.sim label{display:block;font-size:13px;color:#444;margin:10px 0 4px;font-weight:600}
.sim input[type=text],.sim input[type=password]{width:100%;padding:9px 11px;border:1px solid #cbd3db;border-radius:7px;font-size:13px;direction:ltr}
.sim button.go{background:#2d6cdf;color:#fff;border:0;border-radius:7px;padding:9px 18px;font-weight:600;cursor:pointer;margin-top:12px;font-family:inherit}
.sim button.go:hover{background:#2159c7}
.sim .result{margin-top:14px;padding:11px 13px;border-radius:8px;font-size:13px;font-family:"JetBrains Mono",monospace}
.sim .ok{background:#e4f8ec;color:#137a3b;border:1px solid #a9e6c0}
.sim .err{background:#fde8ea;color:#b4232e;border:1px solid #f3b6bc}
.sim .flag{background:#fff7e0;color:#8a6400;border:1px solid #f0d98a}
.sim table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.sim td,.sim th{border:1px solid #e2e7ec;padding:6px 9px;text-align:left}
.sim th{background:#f3f6f9}
.xssfire{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.hintline{font-size:12px;color:var(--mut);margin-top:8px}
.hintline code{background:#15202c;padding:2px 6px;border-radius:5px;color:var(--gold);direction:ltr;display:inline-block}

/* defend */
.fixopt{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.fixopt:hover{border-color:#2a3f52}
.fixopt.sel{border-color:var(--cy);background:#0d1f2b}
.fixopt.correct{border-color:var(--grn);background:var(--grnd)}
.fixopt.wrong{border-color:var(--red);background:var(--redd)}
.fixopt .rb{width:18px;height:18px;border-radius:50%;border:2px solid #39506a;flex-shrink:0;margin-top:3px}
.fixopt.sel .rb{border-color:var(--cy);background:var(--cy)}
.fixopt code{font-size:12px;color:#c6d2df;direction:ltr;display:block;margin-top:6px;background:#0c141d;padding:8px 10px;border-radius:6px;white-space:pre-wrap}

/* report */
.rep label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.rep input,.rep textarea,.rep select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:14px;font-family:inherit}
.rep textarea{min-height:80px;resize:vertical}

/* buttons */
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:var(--grn);color:#062013}
.btn.o{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rowbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* help button + drawer */
.helpbtn{position:fixed;bottom:24px;left:24px;z-index:50;background:linear-gradient(135deg,var(--gold),#e0a92e);color:#2a1e00;border:0;border-radius:40px;padding:13px 20px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;box-shadow:0 8px 26px rgba(242,193,78,.4);display:flex;align-items:center;gap:8px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 26px rgba(242,193,78,.35)}50%{box-shadow:0 8px 32px rgba(242,193,78,.6)}}
.helpbtn.locked-pill{background:#1a2430;color:#7b8a9c;box-shadow:none;animation:none;border:1px solid var(--line);cursor:default;font-weight:600}
.drawer{position:fixed;top:0;left:0;height:100vh;width:420px;max-width:90vw;background:var(--panel);border-left:1px solid var(--line);z-index:60;transform:translateX(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);overflow:auto;box-shadow:12px 0 40px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer .dh{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel)}
.drawer .dh b{font-size:17px}
.drawer .x{cursor:pointer;font-size:22px;color:var(--mut);background:none;border:0}
.drawer .dc{padding:20px}
.hsec{margin-bottom:20px;border-radius:12px;padding:16px;border:1px solid var(--line)}
.hsec.p{background:var(--redd);border-color:#4a1820}
.hsec.v{background:#1a1226;border-color:#3a2a52}
.hsec.s{background:var(--grnd);border-color:#1c4a30}
.hsec h5{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.hsec p{font-size:13px;color:#c6d2df}
.hsec .en{font-size:11px;color:var(--mut);margin-top:7px;border-top:1px dashed #33414f;padding-top:7px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.3s}
.overlay.on{opacity:1;pointer-events:auto}

.toast{position:fixed;bottom:24px;right:24px;z-index:80;background:var(--grnd);border:1px solid var(--grn);color:#bdf5d4;padding:13px 18px;border-radius:12px;font-size:14px;transform:translateY(80px);opacity:0;transition:.35s;display:flex;align-items:center;gap:10px;max-width:340px}
.toast.show{transform:none;opacity:1}
.toast.bad{background:var(--redd);border-color:var(--red);color:#ffc9cf}

.mnav{display:none}
@media(max-width:860px){
  nav.side{display:none}
  main{padding:16px}
  .drawer{width:100%}
  .hero h1{font-size:22px}
  .cv-head .big{width:42px;height:42px;font-size:20px}
  .cv-head h2{font-size:18px}
  .tab{padding:9px 10px;font-size:13px}
  .helpbtn{bottom:16px;left:16px;padding:11px 16px;font-size:13px}
  .mnav{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:20;-webkit-overflow-scrolling:touch}
  .mnav::-webkit-scrollbar{display:none}
  .mchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:7px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
  .mchip.active{border-color:var(--red);background:#1a1012}
  .mchip.locked{opacity:.45}
}
</style>
</head>

<!-- ===== Firebase sync (same-origin as the portal → shares the student's login) ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDUGYkRQq3-IGlA0mFFrB7ON8r5tD1J_7E",authDomain:"osostl-attendance.firebaseapp.com",projectId:"osostl-attendance",storageBucket:"osostl-attendance.firebasestorage.app",messagingSenderId:"285186323376",appId:"1:285186323376:web:83958618d20bcab673dc75"};
let db=null,auth=null,ME=null;
try{
  const app=initializeApp(cfg); db=getFirestore(app); auth=getAuth(app);
  onAuthStateChanged(auth, async u=>{
    ME=null;
    if(u&&u.email){
      const lp=u.email.split('@')[0];
      if(lp.startsWith('st-')){ const num=lp.split('-')[1]; let name=''; try{const sd=await getDoc(doc(db,'students',num)); if(sd.exists())name=sd.data().name||'';}catch(e){} ME={role:'student',num,name,email:u.email}; }
      else if(u.email.startsWith('admin')||u.email.startsWith('acadmic')){ ME={role:'admin',email:u.email}; }
      else if(lp.startsWith('t-')){ ME={role:'trainer',email:u.email}; }
      else if(u.email.startsWith('audit')){ ME={role:'auditor',email:u.email}; }
    }
    window.dispatchEvent(new CustomEvent('labauth',{detail:ME}));
  });
  // live help-button toggle
  onSnapshot(doc(db,'labCfg','help'), s=>{ window.dispatchEvent(new CustomEvent('labhelp',{detail:s.exists()?s.data().enabled!==false:true})); }, ()=>{});
}catch(e){ console.warn('Firebase offline, using local only',e); }
window.LabCloud={
  ready:!!db, me(){return ME;},
  async push(num,data){ if(!db||!num) return; try{ await setDoc(doc(db,'campLab',num),data,{merge:true}); }catch(e){} },
  async pull(num){ if(!db||!num) return null; try{ const s=await getDoc(doc(db,'campLab',num)); return s.exists()?s.data():null; }catch(e){ return null; } },
  async all(){ if(!db) return null; try{ const s=await getDocs(collection(db,'campLab')); return s.docs.map(d=>({num:d.id,...d.data()})); }catch(e){ return null; } },
  async setHelp(on){ if(!db) return false; try{ await setDoc(doc(db,'labCfg','help'),{enabled:!!on},{merge:true}); return true; }catch(e){ return false; } },
};
</script>

<script>
/* =========================================================
   مختبر أسس السيبراني — OSOS Cyber Lab
   كل الأهداف محاكاة داخل المتصفح فقط — لا خوادم حقيقية.
   All targets are simulated in-browser only. No real systems.
   ========================================================= */

const LEVELS = [
  {id:"L0", ar:"المستوى ٠ · الأساسيات", en:"Foundations"},
  {id:"L1", ar:"المستوى ١ · اللغة والأدوات", en:"Language & Tools"},
  {id:"L2", ar:"المستوى ٢ · الهجوم", en:"Attack"},
  {id:"L3", ar:"المستوى ٣ · الدفاع", en:"Defense"},
  {id:"L4", ar:"المستوى ٤ · التقرير والاختبار", en:"Report & Exam"},
];

/* ---- challenge definitions ---- */
const CH = [
  /* ---------- L2: SQL Injection ---------- */
  {
    id:"sqli", lvl:"L2", icon:"💉", diff:"easy", xp:100,
    ar:"تجاوز الدخول بـ SQL Injection", en:"SQL Injection — Login Bypass",
    tags:["OWASP A03","Web"],
    scenario_en:"The 'OSOS Bank' staff portal has a login form. Your mission: get in without valid credentials, then fix the flaw.",
    scenario_ar:"بوابة موظّفي «بنك أسس» فيها نموذج دخول. مهمّتك: ادخل بدون بيانات صحيحة، ثم أصلح الثغرة.",
    target:"sqli",
    hint_en:"What happens if the username field is pasted straight into an SQL query? Try breaking out with a quote.",
    hint_ar:"ماذا لو وُضعت خانة اسم المستخدم مباشرة داخل استعلام SQL؟ جرّب الخروج منها بعلامة اقتباس.",
    fixes:[
      {ar:"استعلام مُعامَل (Prepared Statement)", code:"db.query('SELECT * FROM users WHERE user=? AND pass=?',[u,p])", correct:true},
      {ar:"إزالة علامات الاقتباس من المدخل فقط", code:"u = u.replace(\"'\",'')", correct:false},
      {ar:"إخفاء رسالة الخطأ", code:"catch(e){ return 'خطأ' }", correct:false},
    ],
    help:{
      p_en:"You logged in without a password. The app glued your input into an SQL query, so your quote changed the query's logic.",
      p_ar:"دخلت بلا كلمة مرور. التطبيق لصق مدخلك داخل استعلام SQL، فعلامة الاقتباس غيّرت منطق الاستعلام.",
      v_en:"SQL Injection: untrusted input is treated as part of the SQL command instead of as data.",
      v_ar:"حقن SQL: المدخل غير الموثوق يُعامَل كجزء من أمر SQL بدل أن يكون بيانات.",
      s_en:"Use parameterised queries (prepared statements). The query text stays fixed; values travel separately so the database never confuses data with command.",
      s_ar:"استخدم الاستعلامات المُعامَلة. نص الاستعلام يبقى ثابتاً؛ القيم تسافر منفصلة فلا تخلط قاعدة البيانات البيانات بالأمر."
    }
  },
  /* ---------- L2: XSS ---------- */
  {
    id:"xss", lvl:"L2", icon:"📝", diff:"easy", xp:100,
    ar:"XSS مُخزَّن في دفتر الزوّار", en:"Stored XSS — Guestbook",

/* ============ STATE ============ */
let state = load();
let cur = null;        // current challenge id
let curTab = 0;
let ME = null;         // identity from portal login (or null)
let helpEnabled = true;// toggled by admin/trainer
const TRIES = {};      // runtime attempt counter per challenge
let stationEnter = 0;  // timestamp when current solving-station was opened
let helpTimer = null;  // 90s reveal timer
const HELP_STATIONS = ['discover','exploit','defend'];
const TRY_THRESHOLD = 2;      // attempts before help unlocks
const TIME_THRESHOLD = 90000; // or 90 seconds on the station
function bumpTry(){
  if(!cur) return; TRIES[cur]=(TRIES[cur]||0)+1;
  if(TRIES[cur]>=TRY_THRESHOLD) applyHelpVisibility();
}
function helpUnlocked(id){
  if(!helpEnabled || !id) return false;
  if((TRIES[id]||0) >= TRY_THRESHOLD) return true;
  if(stationEnter && (Date.now()-stationEnter) >= TIME_THRESHOLD) return true;
  return false;
}
const params = new URLSearchParams(location.search);
const ADMINVIEW = params.get('admin')==='1';
function lsKey(){ return 'ososlab_'+(ME&&ME.num?ME.num:'guest'); }
function load(){
  try{ return JSON.parse(localStorage.getItem('ososlab')||'{}'); }catch(e){ return {}; }
}
let _pushT;
function save(){
  try{ localStorage.setItem('ososlab',JSON.stringify(state)); }catch(e){}
  // sync to portal if a student is logged in
  if(ME&&ME.role==='student'&&ME.num&&window.LabCloud){
    clearTimeout(_pushT);
    _pushT=setTimeout(()=>{ window.LabCloud.push(ME.num,{name:ME.name||'',num:ME.num,updated:Date.now(),prog:state}); },700);
  }
}
/* portal login arrives (same-origin auth) */
window.addEventListener('labauth', async e=>{
  ME=e.detail;
  if(ME&&ME.role==='student'&&ME.num&&window.LabCloud){
    const remote=await window.LabCloud.pull(ME.num);
    if(remote&&remote.prog){ // merge: keep any completed step from either side
      Object.keys(remote.prog).forEach(id=>{ state[id]=Object.assign({},remote.prog[id],state[id]); });
      try{ localStorage.setItem('ososlab',JSON.stringify(state)); }catch(e){}
    }
  }
  if(ADMINVIEW && ME && (ME.role==='admin'||ME.role==='trainer'||ME.role==='auditor')){ renderAdmin(); }
  else { renderSide(); if(!cur) goHome(); else if(cur&&CH.find(x=>x.id===cur)) renderChallenge(); }
});
window.addEventListener('labhelp', e=>{ helpEnabled=e.detail!==false; applyHelpVisibility(); });
function applyHelpVisibility(){
  const b=document.getElementById('helpbtn'); if(!b) return;
  const onChal = cur && CH.find(x=>x.id===cur);
  const station = onChal ? STATIONS[curTab].k : null;
  if(!onChal || !helpEnabled || HELP_STATIONS.indexOf(station)<0){ b.style.display='none'; return; }
  if(helpUnlocked(cur)){
    b.className='helpbtn'; b.style.display='flex';
    b.onclick=openHelp; b.innerHTML='🆘 تورطت؟ ساعدني';
  } else {
    // locked pill — visible but muted, cannot open help yet
    b.className='helpbtn locked-pill'; b.style.display='flex';
    b.onclick=()=>toast('🔒 حاول أولاً — المساعدة تُفتح بعد محاولتين أو بعد قليل.',true);
    b.innerHTML='🔒 المساعدة تُفتح بعد أن تحاول';
  }
}
function prog(id){ return state[id] || {}; }
function setStep(id,step){ state[id]=Object.assign({},state[id],{[step]:true}); save(); }

const RANKS=[[0,"مبتدئ"],[200,"متدرّب"],[450,"مخترق أخلاقي"],[700,"مدافع"],[900,"محترف أمن"],[1100,"خبير أسس"]];
function totalXP(){
  let x=0; CH.forEach(c=>{ const p=prog(c.id); if(p.exploited&&p.defended&&p.reported){ const pen=Math.min(0.3,0.1*(p.helpTier||0)); x+=Math.round(c.xp*(1-pen)); } }); return x;
}
function maxXP(){ return CH.reduce((a,c)=>a+c.xp,0); }
function rankOf(x){ let r=RANKS[0][1]; RANKS.forEach(([t,n])=>{ if(x>=t) r=n; }); return r; }
function chalDone(id){ const p=prog(id); return !!(p.exploited&&p.defended&&p.reported); }
/* ordered list of levels that actually contain challenges */
function chalLevels(){ return LEVELS.map(l=>l.id).filter(id=>CH.some(c=>c.lvl===id)); }
/* a level is unlocked when ALL challenges in every earlier challenge-level are complete */
function levelUnlocked(lvlId){
  const order=chalLevels(); const idx=order.indexOf(lvlId);
  if(idx<=0) return true;
  for(let i=0;i<idx;i++){ const done=CH.filter(c=>c.lvl===order[i]).every(c=>chalDone(c.id)); if(!done) return false; }
  return true;
}
function prevLevelName(lvlId){ const order=chalLevels(); const idx=order.indexOf(lvlId); if(idx<=0) return ''; const L=LEVELS.find(l=>l.id===order[idx-1]); return L?L.ar:''; }
function allComplete(){ return CH.every(c=>chalDone(c.id)); }

/* ============ RENDER: sidebar ============ */
function renderSide(){
  const s=document.getElementById('side'); let h='';
  LEVELS.forEach(L=>{
    const items=[...INTRO.filter(i=>i.lvl===L.id),...CH.filter(c=>c.lvl===L.id)];
    if(!items.length) return;
    const lu=levelUnlocked(L.id);
    h+=`<div class="lvl"><h4><span>${L.ar} ${(!lu)?'🔒':''}</span><span class="en">${L.en}</span></h4>`;
    items.forEach(it=>{
      const isCh=!!it.target; const p=prog(it.id);
      const complete=isCh&&p.exploited&&p.defended&&p.reported;
      const locked=isCh&&!lu;
      const st=locked?'<span class="st">🔒</span>':complete?'<span class="st">✅</span>':isCh&&(p.exploited||p.defended)?'<span class="st">🔸</span>':isCh?'<span class="st" style="color:var(--mut)">○</span>':'<span class="st" style="color:var(--mut)">📖</span>';
      const dd=isCh&&!locked?`<span class="diffdot d-${it.diff}"></span>`:'';
      h+=`<div class="chal ${cur===it.id?'active':''} ${locked?'locked':''}" onclick="open_('${it.id}')">
        <div class="ico">${it.icon}</div>
        <div class="nm">${it.ar}<small>${it.en}</small></div>
        ${dd}${st}</div>`;
    });
    h+='</div>';
  });
  s.innerHTML=h;
}

}

/* ============ OPEN CHALLENGE ============ */
function open_(id){
  const intro=INTRO.find(i=>i.id===id);
  if(intro){ openIntro(intro); return; }
  const c=CH.find(x=>x.id===id);
  if(c && !levelUnlocked(c.lvl)){ toast('🔒 أكمل «'+prevLevelName(c.lvl)+'» أولاً لفتح هذا المستوى.',true); return; }
  cur=id; curTab=0; closeHelp(); renderSide();
  applyHelpVisibility();

}

/* ============ CHALLENGE VIEW ============ */
const STATIONS=[
  {k:"brief", ar:"المهمة", en:"Brief", ic:"🎯"},
  {k:"discover", ar:"اكتشف", en:"Discover", ic:"🔍"},
  {k:"exploit", ar:"اهجم", en:"Exploit", ic:"⚔️"},
  {k:"defend", ar:"دافع", en:"Defend", ic:"🛡️"},
  {k:"report", ar:"التقرير", en:"Report", ic:"📝"},
];
function renderChallenge(){
  const c=CH.find(x=>x.id===cur); const p=prog(c.id);
  const tabs=STATIONS.map((s,i)=>{
    let done='';
    if(s.k==='exploit'&&p.exploited) done='<span class="done">✓</span>';
    if(s.k==='defend'&&p.defended) done='<span class="done">✓</span>';
    if(s.k==='report'&&p.reported) done='<span class="done">✓</span>';
    return `<div class="tab ${i===curTab?'on':''}" onclick="curTab=${i};renderChallenge()">
      ${s.ic} <span>${s.ar}<br><span class="en">${s.en}</span></span> ${done}</div>`;
  }).join('');
  const body=stationBody(c,p,STATIONS[curTab].k);
  document.getElementById('main').innerHTML=`
    <div class="cv-head"><div class="big">${c.icon}</div>
      <div><h2>${c.ar}</h2><div class="en">${c.en}</div>
      <div class="badges">${c.tags.map(t=>`<span class="b">${t}</span>`).join('')}
        <span class="b"><span class="diffdot d-${c.diff}" style="display:inline-block;margin-left:5px"></span>${c.diff==='easy'?'سهل':c.diff==='med'?'متوسط':'صعب'}</span>
        <span class="b">🏆 ${c.xp} XP</span></div></div></div>
    <div class="tabs">${tabs}</div>
    <div class="pane" id="pane">${body}</div>`;
  const st=STATIONS[curTab].k;
  if(st==='discover'||st==='exploit') mountTarget(c,st);
  clearTimeout(helpTimer);
  if(HELP_STATIONS.indexOf(st)>=0){ stationEnter=Date.now(); helpTimer=setTimeout(()=>applyHelpVisibility(), TIME_THRESHOLD); }
  renderMobileNav(); applyHelpVisibility(); renderXP();
}

function stationBody(c,p,k){
  if(k==='brief') return `
    <div class="bl goal"><h4>🎯 المهمة · Mission</h4><p>${c.scenario_ar}</p><div class="en">${c.scenario_en}</div></div>

    <p>١. <b>اكتشف</b> الهدف وافهم كيف يعمل. ٢. <b>اهجم</b> لإثبات الثغرة بأدنى فعل. ٣. <b>دافع</b> بإصلاح الجذر وأعد الاختبار. ٤. اكتب <b>التقرير</b> الفني.</p>
    <div class="en">1. Discover · 2. Exploit (proof only) · 3. Defend (fix &amp; retest) · 4. Report</div></div>
    ${bankCard(c.id)}
    <div class="rowbtns"><button class="btn" onclick="curTab=1;renderChallenge()">ابدأ المهمة → اكتشف</button></div>`;
  if(k==='discover') return `
    <div class="bl"><h4>🔍 استكشف الهدف</h4><p>تصفّح التطبيق كمستخدم عادي. لاحظ كل خانة إدخال وكل رابط. اسأل: أين يثق النظام بي؟</p>
    <div class="en">Browse as a normal user. Note every input. Ask: where does the system trust me?</div></div>
    <div id="tgt"></div>
    <div class="hintline">💡 تلميح: ${c.hint_ar} <br><span class="en" style="margin-top:4px">${c.hint_en}</span></div>
    ${bankCard(c.id)}
    <div class="rowbtns"><button class="btn" onclick="curTab=2;renderChallenge()">انتقل للهجوم →</button></div>`;
  if(k==='exploit'){
    const d=p.exploited?`<div class="bl" style="border-color:var(--grn);background:var(--grnd)"><h4 style="color:var(--grn)">✅ تم إثبات الثغرة!</h4><p>نجحت في استغلال الهدف. انتقل الآن لمحطّة الدفاع لإصلاح الجذر.</p><div class="en">Vulnerability proven. Move to Defend to fix the root cause.</div></div>`:'';
    return `${d}
    <div class="bl"><h4>⚔️ اهجم — إثبات فقط</h4><p>نفّذ أصغر فعل يُثبت الثغرة. لا تتجاوز الإثبات أبداً.</p>
    <div class="en">Perform the smallest action that proves the flaw. Never go beyond proof.</div></div>
    <div id="tgt"></div>
    <div class="hintline">💡 ${c.hint_ar}</div>
    ${p.exploited?`<div class="rowbtns"><button class="btn g" onclick="curTab=3;renderChallenge()">🛡️ انتقل للدفاع →</button></div>`:''}`;
  }
  if(k==='defend'){
    if(!p.exploited) return `<div class="bl" style="border-color:var(--gold)"><h4 style="color:var(--gold)">🔒 أثبت الثغرة أولاً</h4><p>عد لمحطّة «اهجم» وأثبت الثغرة قبل أن تتعلّم كيف تصلحها.</p></div>
      <div class="rowbtns"><button class="btn o" onclick="curTab=2;renderChallenge()">← رجوع للهجوم</button></div>`;
    const opts=c.fixes.map((f,i)=>{
      let cls=''; if(p.defendPick!=null){ if(f.correct) cls='correct'; else if(p.defendPick===i) cls='wrong'; }
      else if(p.defendSel===i) cls='sel';
      return `<div class="fixopt ${cls}" onclick="pickFix('${c.id}',${i})">

  const c=CH.find(x=>x.id===cur); if(!c) return; const h=c.help; const t=helpTier(c.id);
  const tiers=[
    {cls:'',  ic:'💡', ar:'المستوى ١ · نصيحة', en:'Tier 1 · Nudge', body:c.hint_ar, body_en:c.hint_en},
    {cls:'v', ic:'🟣', ar:'المستوى ٢ · أين المشكلة', en:'Tier 2 · What & where', body:h.p_ar+' '+h.v_ar, body_en:h.p_en+' '+h.v_en},
    {cls:'s', ic:'🟢', ar:'المستوى ٣ · الحل الكامل', en:'Tier 3 · Full solution', body:h.s_ar, body_en:h.s_en},
  ];
  let html='';
  for(let i=0;i<3;i++){
    if(i<t){ const x=tiers[i];
      html+=`<div class="hsec ${x.cls}"><h5>${x.ic} ${x.ar}</h5><p>${x.body}</p><div class="en">${x.body_en}</div></div>`;
    }
  }
  const pen=Math.min(30,10*t);
  if(t<3){
    html+=`<div style="text-align:center;margin:14px 0">
      <button class="btn" onclick="revealTier()">افتح ${t===0?'أول':'المستوى '+(t+1)} مستوى مساعدة ↓</button>
      <div style="font-size:11px;color:var(--mut);margin-top:8px">كل مستوى يخصم ١٠٪ من نقاط التحدّي · الخصم الحالي: ${pen}٪</div></div>`;
  } else {
    html+=`<div style="font-size:12px;color:var(--mut);text-align:center;margin-top:12px">كشفت كل المستويات (خصم ${pen}٪). المرجع الكامل في كتاب المتدرب العملي.</div>`;
  }
  document.getElementById('helpBody').innerHTML=html;
}
function closeHelp(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('ov').classList.remove('on'); }

/* ============ TOAST ============ */
let toastT;
function toast(msg,bad){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(bad?' bad':''),2600);
}

/* ============ MOBILE NAV ============ */
function renderMobileNav(){
  const m=document.getElementById('mnav'); if(!m) return;
  m.innerHTML='<div class="mchip" onclick="goHome()">🏠</div>'+CH.map(c=>{
    const locked=!levelUnlocked(c.lvl); const done=chalDone(c.id);
    return `<div class="mchip ${cur===c.id?'active':''} ${locked?'locked':''}" onclick="open_('${c.id}')">${locked?'🔒':(done?'✅':c.icon)} ${c.ar}</div>`;
  }).join('');
}

/* ============ CERTIFICATE ============ */
function showCert(){
  if(!allComplete()){ toast('أكمل كل التحدّيات أولاً.',true); return; }
  closeHelp(); document.getElementById('helpbtn').style.display='none';
  const nm=(ME&&ME.name)?ME.name:(localStorage.getItem('labCertName')||'');
  const d=new Date();
  const dateStr=d.getDate()+' / '+(d.getMonth()+1)+' / '+d.getFullYear();
  const vulns=CH.map(c=>`<span style="display:inline-block;background:#122;border:1px solid #1e3a3a;color:#bfe;border-radius:20px;padding:3px 11px;margin:3px;font-size:12px">${c.icon} ${c.ar}</span>`).join('');
  document.getElementById('main').innerHTML=`
    <div style="max-width:760px;margin:0 auto">
    ${nm?'':`<div class="bl" style="border-color:var(--gold)"><h4 style="color:var(--gold)">✍️ اسمك على الشهادة</h4>
      <input id="certName" placeholder="اكتب اسمك الكامل" style="width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:15px;margin-top:8px">
      <div class="rowbtns"><button class="btn" onclick="saveCertName()">اعتمد الاسم</button></div></div>`}
    <div id="certCard" style="background:linear-gradient(135deg,#0d1a24,#0a1118);border:2px solid var(--gold);border-radius:18px;padding:40px 36px;text-align:center;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:radial-gradient(600px 200px at 50% -20%,rgba(242,193,78,.12),transparent)"></div>
      <div style="position:relative">
        <div style="font-size:13px;letter-spacing:3px;color:var(--gold);margin-bottom:6px">معهد أسس التقنية والقانون العالي للتدريب</div>
        <div style="font-size:11px;color:var(--mut);letter-spacing:1px;margin-bottom:22px">OSOS INSTITUTE · CYBER LAB</div>
        <div style="width:58px;height:58px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,var(--red),#b3303c);display:grid;place-items:center;font-size:28px;font-weight:700;box-shadow:0 0 22px rgba(255,77,94,.4)">أ</div>
        <div style="font-size:20px;color:#c6d2df;margin-bottom:4px">شهادة إتمام مختبر الأمن السيبراني</div>
        <div style="font-size:12px;color:var(--mut);margin-bottom:20px" class="en">Certificate of Completion — Cyber Security Lab</div>
        <div style="font-size:13px;color:var(--mut)">تُمنح هذه الشهادة إلى</div>
        <div style="font-size:30px;font-weight:700;color:var(--gold);margin:8px 0 4px">${nm||'—'}</div>
        ${ME&&ME.num?`<div style="font-size:12px;color:var(--mut)">الرقم التدريبي: ${ME.num}</div>`:''}
        <div style="font-size:14px;color:#c6d2df;max-width:520px;margin:18px auto;line-height:1.9">لإتمامه بنجاح جميع تحدّيات المختبر التفاعلي عبر المحطّات الأربع — الاكتشاف والهجوم والدفاع وكتابة التقرير — وإتقانه معالجة الثغرات التالية:</div>
        <div style="margin:10px 0 18px">${vulns}</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;border-top:1px solid #1e2a38;padding-top:16px">
          <div style="text-align:center;font-size:12px;color:var(--mut)">التاريخ<br><b style="color:var(--txt)">${dateStr}</b></div>
          <div style="text-align:center;font-size:12px;color:var(--mut)">المجموع<br><b style="color:var(--grn)">${totalXP()} XP · ${rankOf(totalXP())}</b></div>
          <div style="text-align:center;font-size:12px;color:var(--mut)">التوقيع<br><b style="color:var(--txt)">إدارة المعسكر</b></div>
        </div>
      </div>
    </div>
    <div class="rowbtns" style="justify-content:center;margin-top:18px">
      <button class="btn o" onclick="goHome()">← رجوع</button>
      <button class="btn" style="background:var(--gold);color:#2a1e00" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    </div></div>`;
  renderMobileNav();
}
function saveCertName(){ const v=(document.getElementById('certName').value||'').trim(); if(v.length<2){toast('اكتب اسمك.',true);return;} localStorage.setItem('labCertName',v); if(!ME)ME={}; ME.name=v; showCert(); }

/* ============ STAFF DASHBOARD (?admin=1) ============ */
async function renderAdmin(){
  document.getElementById('helpbtn').style.display='none';
  const m=document.getElementById('main');
  m.innerHTML=`<div class="hero"><h1>لوحة المشرف · تقدّم المختبر</h1><div class="en">Instructor Dashboard — Lab Progress</div>
    <p>متابعة إنجاز الطلاب في مختبر الأمن السيبراني، والتحكّم بزر المساعدة.</p></div>
    <div class="bl"><h4>🆘 زر «تورطت؟ ساعدني»</h4>
    <p>يظهر للطلاب داخل كل تحدٍّ ليشرح المشكلة والثغرة والحل. يمكنك إيقافه أثناء الاختبارات وتشغيله وقت التدريب.</p>
    <div class="rowbtns">
      <button class="btn g" onclick="toggleHelp(true)">✅ تشغيل الزر</button>
      <button class="btn" onclick="toggleHelp(false)">🚫 إيقاف الزر</button>
      <span id="helpState" style="align-self:center;color:var(--mut)">الحالة: ${helpEnabled?'مُفعّل':'موقوف'}</span>
    </div></div>
    <div id="roster"><div class="bl">جارِ تحميل بيانات الطلاب…</div></div>`;
  const rows = window.LabCloud ? await window.LabCloud.all() : null;
  const r=document.getElementById('roster');
  if(rows===null){ r.innerHTML=`<div class="bl" style="border-color:var(--gold)"><p>تعذّر تحميل البيانات. افتح هذه الصفحة وأنت مسجّل دخول كمشرف/مدرب من نفس نطاق البوابة.</p><div class="en">Open this page while signed in as admin/trainer on the portal's domain.</div></div>`; return; }
  if(!rows.length){ r.innerHTML=`<div class="bl"><p>لا يوجد طلاب بدؤوا المختبر بعد.</p></div>`; return; }
  const head=CH.map(c=>`<th title="${c.ar}">${c.icon}</th>`).join('');
  const body=rows.sort((a,b)=>(b.updated||0)-(a.updated||0)).map(st=>{
    const pr=st.prog||{};
    const cells=CH.map(c=>{ const p=pr[c.id]||{}; const done=p.exploited&&p.defended&&p.reported; const part=p.exploited||p.defended; return `<td style="text-align:center;color:${done?'var(--grn)':part?'var(--gold)':'#3a4a5a'}">${done?'✅':part?'🔸':'○'}</td>`; }).join('');
    const nDone=CH.filter(c=>{const p=pr[c.id]||{};return p.exploited&&p.defended&&p.reported;}).length;
    const pct=Math.round(nDone/CH.length*100);
    return `<tr><td style="white-space:nowrap"><b>${st.name||'—'}</b><br><span style="font-size:11px;color:var(--mut)">#${st.num}</span></td>${cells}
      <td style="text-align:center"><b style="color:${pct===100?'var(--grn)':'var(--txt)'}">${pct}%</b></td></tr>`;
  }).join('');
  r.innerHTML=`<div class="bl" style="padding:0;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
    <tr style="background:var(--panel2)"><th style="text-align:right;padding:10px 12px">الطالب</th>${head}<th style="padding:10px">%</th></tr>
    ${body}</table></div>
    <p style="font-size:12px;color:var(--mut)">الرموز: ✅ مكتمل · 🔸 جارٍ · ○ لم يبدأ — الأعمدة بترتيب التحدّيات.</p>`;
  // simple table styling
  r.querySelectorAll('td,th').forEach(e=>{e.style.borderBottom='1px solid var(--line)';e.style.padding=e.style.padding||'9px 10px';});
}
async function toggleHelp(on){
  const ok = window.LabCloud ? await window.LabCloud.setHelp(on) : false;
  helpEnabled=on; const s=document.getElementById('helpState'); if(s)s.textContent='الحالة: '+(on?'مُفعّل':'موقوف');
  toast(ok?('تم '+(on?'تشغيل':'إيقاف')+' زر المساعدة لكل الطلاب.'):'تعذّر الحفظ في القاعدة (طُبّق محلياً فقط).',!ok);
}

if(ADMINVIEW){ document.getElementById('main').innerHTML='<div class="bl">جارِ التحقّق من صلاحية المشرف…</div>'; }
else { renderSide(); goHome(); }
