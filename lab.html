<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر أسس السيبراني · OSOS Cyber Lab</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --panel:#111823; --panel2:#0d141d; --line:#1e2a38;
  --txt:#e6edf3; --mut:#8b9bb0; --red:#ff4d5e; --redd:#2a0f14;
  --grn:#3ddc84; --grnd:#0f2418; --cy:#36c5f0; --gold:#f2c14e;
  --vio:#a371f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans Arabic",sans-serif;line-height:1.7;min-height:100vh}
code,.mono,pre,input,textarea,.term{font-family:"JetBrains Mono",monospace}
a{color:var(--cy)}
.en{direction:ltr;text-align:left;display:block;font-family:"JetBrains Mono",monospace}
.hidden{display:none!important}

/* ---- top bar ---- */
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0d1420,#0a0e14);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--red),#b3303c);display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 0 18px rgba(255,77,94,.4)}
.logo b{font-size:17px;letter-spacing:.3px}
.logo span{font-size:11px;color:var(--mut);display:block;margin-top:-2px}
.hdr-spacer{flex:1}
.rank{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.rank .xp{font-size:12px;color:var(--mut)}
.rank b{color:var(--gold)}
.bar{height:7px;background:#1a2430;border-radius:20px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--cy));border-radius:20px;transition:width .5s}

/* ---- layout ---- */
.wrap{display:flex;gap:0;align-items:flex-start}
nav.side{width:300px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel2);min-height:calc(100vh - 64px);padding:16px 12px;position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto}
.lvl{margin-bottom:14px}
.lvl>h4{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center}
.lvl>h4 .en{font-size:10px}
.chal{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px;transition:.15s;border:1px solid transparent}
.chal:hover{background:#10202c}
.chal.active{background:#0e2230;border-color:#1c4257}
.chal .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:#162230;flex-shrink:0}
.chal .nm{flex:1}
.chal .nm small{display:block;font-size:10px;color:var(--mut)}
.chal .st{font-size:13px}
.chal.locked{opacity:.4;cursor:not-allowed}
.diffdot{width:7px;height:7px;border-radius:50%}
.d-easy{background:var(--grn)} .d-med{background:var(--gold)} .d-hard{background:var(--red)}

main{flex:1;padding:24px 30px;max-width:980px;min-height:calc(100vh - 64px)}

/* ---- home ---- */
.hero{background:radial-gradient(1200px 300px at 80% -40%,rgba(255,77,94,.14),transparent),linear-gradient(135deg,#0f1a26,#0b1118);border:1px solid var(--line);border-radius:18px;padding:30px 32px;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{font-size:27px;margin-bottom:6px}
.hero .en{font-size:14px;color:var(--mut);margin-bottom:14px}
.hero p{color:#c6d2df;max-width:640px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{background:#132130;border:1px solid var(--line);border-radius:30px;padding:5px 13px;font-size:12px;color:#aebccb}
.chip b{color:var(--grn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:#2a3f52;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .en{font-size:11px;color:var(--mut);margin-bottom:8px}
.card p{font-size:13px;color:#aab8c7}
.card .foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.secnote{background:var(--redd);border:1px solid #4a1820;border-radius:12px;padding:14px 18px;margin:20px 0;font-size:13px;color:#ffc9cf;display:flex;gap:12px;align-items:flex-start}
.secnote .en{color:#e79aa2;font-size:11px;margin-top:3px}

/* ---- challenge view ---- */
.cv-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.cv-head .big{width:52px;height:52px;border-radius:13px;background:#162230;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.cv-head h2{font-size:22px}
.cv-head .en{font-size:13px;color:var(--mut)}
.badges{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.b{font-size:11px;padding:3px 9px;border-radius:20px;background:#132130;border:1px solid var(--line);color:#aebccb}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:11px 15px;cursor:pointer;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.on{color:var(--txt);border-color:var(--red)}
.tab .done{color:var(--grn);font-size:12px}
.tab .en{font-size:9px;opacity:.7}

.pane{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.bl .en{font-size:12px;color:var(--mut);margin-top:8px;border-top:1px dashed #22303f;padding-top:8px}
.bl h4{margin-bottom:6px;color:var(--cy);font-size:15px}
.goal{border-right:3px solid var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.06),transparent)}

/* simulated browser */
.sim{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:#fff;color:#1a2230}
.sim .urlbar{background:#e9eef3;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #d6dde4}
.sim .dots{display:flex;gap:5px}.sim .dots i{width:11px;height:11px;border-radius:50%}
.sim .dots i:nth-child(1){background:#ff5f57}.sim .dots i:nth-child(2){background:#febc2e}.sim .dots i:nth-child(3){background:#28c840}
.sim .addr{flex:1;background:#fff;border:1px solid #d0d7de;border-radius:7px;padding:5px 11px;font-size:12px;color:#55606b;font-family:"JetBrains Mono",monospace;direction:ltr;text-align:left;cursor:text}
.sim .body{padding:22px;direction:ltr;text-align:left;min-height:120px}
.sim .sitehdr{display:flex;align-items:center;gap:10px;border-bottom:2px solid #eee;padding-bottom:12px;margin-bottom:16px}
.sim .sitehdr .lg{width:30px;height:30px;border-radius:7px;background:#2d6cdf;display:grid;place-items:center;color:#fff;font-weight:700}
.sim .sitehdr b{font-size:16px;color:#1a2230}
.sim label{display:block;font-size:13px;color:#444;margin:10px 0 4px;font-weight:600}
.sim input[type=text],.sim input[type=password]{width:100%;padding:9px 11px;border:1px solid #cbd3db;border-radius:7px;font-size:13px;direction:ltr}
.sim button.go{background:#2d6cdf;color:#fff;border:0;border-radius:7px;padding:9px 18px;font-weight:600;cursor:pointer;margin-top:12px;font-family:inherit}
.sim button.go:hover{background:#2159c7}
.sim .result{margin-top:14px;padding:11px 13px;border-radius:8px;font-size:13px;font-family:"JetBrains Mono",monospace}
.sim .ok{background:#e4f8ec;color:#137a3b;border:1px solid #a9e6c0}
.sim .err{background:#fde8ea;color:#b4232e;border:1px solid #f3b6bc}
.sim .flag{background:#fff7e0;color:#8a6400;border:1px solid #f0d98a}
.sim table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.sim td,.sim th{border:1px solid #e2e7ec;padding:6px 9px;text-align:left}
.sim th{background:#f3f6f9}
.xssfire{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.hintline{font-size:12px;color:var(--mut);margin-top:8px}
.hintline code{background:#15202c;padding:2px 6px;border-radius:5px;color:var(--gold);direction:ltr;display:inline-block}

/* defend */
.fixopt{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.fixopt:hover{border-color:#2a3f52}
.fixopt.sel{border-color:var(--cy);background:#0d1f2b}
.fixopt.correct{border-color:var(--grn);background:var(--grnd)}
.fixopt.wrong{border-color:var(--red);background:var(--redd)}
.fixopt .rb{width:18px;height:18px;border-radius:50%;border:2px solid #39506a;flex-shrink:0;margin-top:3px}
.fixopt.sel .rb{border-color:var(--cy);background:var(--cy)}
.fixopt code{font-size:12px;color:#c6d2df;direction:ltr;display:block;margin-top:6px;background:#0c141d;padding:8px 10px;border-radius:6px;white-space:pre-wrap}

/* report */
.rep label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.rep input,.rep textarea,.rep select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:14px;font-family:inherit}
.rep textarea{min-height:80px;resize:vertical}

/* buttons */
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:var(--grn);color:#062013}
.btn.o{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rowbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* help button + drawer */
.helpbtn{position:fixed;bottom:24px;left:24px;z-index:50;background:linear-gradient(135deg,var(--gold),#e0a92e);color:#2a1e00;border:0;border-radius:40px;padding:13px 20px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;box-shadow:0 8px 26px rgba(242,193,78,.4);display:flex;align-items:center;gap:8px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 26px rgba(242,193,78,.35)}50%{box-shadow:0 8px 32px rgba(242,193,78,.6)}}
.helpbtn.locked-pill{background:#1a2430;color:#7b8a9c;box-shadow:none;animation:none;border:1px solid var(--line);cursor:default;font-weight:600}
.drawer{position:fixed;top:0;left:0;height:100vh;width:420px;max-width:90vw;background:var(--panel);border-left:1px solid var(--line);z-index:60;transform:translateX(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);overflow:auto;box-shadow:12px 0 40px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer .dh{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel)}
.drawer .dh b{font-size:17px}
.drawer .x{cursor:pointer;font-size:22px;color:var(--mut);background:none;border:0}
.drawer .dc{padding:20px}
.hsec{margin-bottom:20px;border-radius:12px;padding:16px;border:1px solid var(--line)}
.hsec.p{background:var(--redd);border-color:#4a1820}
.hsec.v{background:#1a1226;border-color:#3a2a52}
.hsec.s{background:var(--grnd);border-color:#1c4a30}
.hsec h5{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.hsec p{font-size:13px;color:#c6d2df}
.hsec .en{font-size:11px;color:var(--mut);margin-top:7px;border-top:1px dashed #33414f;padding-top:7px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.3s}
.overlay.on{opacity:1;pointer-events:auto}

.toast{position:fixed;bottom:24px;right:24px;z-index:80;background:var(--grnd);border:1px solid var(--grn);color:#bdf5d4;padding:13px 18px;border-radius:12px;font-size:14px;transform:translateY(80px);opacity:0;transition:.35s;display:flex;align-items:center;gap:10px;max-width:340px}
.toast.show{transform:none;opacity:1}
.toast.bad{background:var(--redd);border-color:var(--red);color:#ffc9cf}

.mnav{display:none}
@media(max-width:860px){
  nav.side{display:none}
  main{padding:16px}
  .drawer{width:100%}
  .hero h1{font-size:22px}
  .cv-head .big{width:42px;height:42px;font-size:20px}
  .cv-head h2{font-size:18px}
  .tab{padding:9px 10px;font-size:13px}
  .helpbtn{bottom:16px;left:16px;padding:11px 16px;font-size:13px}
  .mnav{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:20;-webkit-overflow-scrolling:touch}
  .mnav::-webkit-scrollbar{display:none}
  .mchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:7px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
  .mchip.active{border-color:var(--red);background:#1a1012}
  .mchip.locked{opacity:.45}
}

/* ---- scenario badge ---- */
.scen{display:inline-flex;align-items:center;gap:7px;background:#132130;border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:12px;color:#cfe;white-space:nowrap}
.scen i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---- terminal (level 0) ---- */
.term{background:#05080c;border:1px solid #1d2a36;border-radius:12px;overflow:hidden;margin:14px 0;direction:ltr;text-align:left}
.term .tbar{background:#111a24;padding:7px 12px;display:flex;gap:6px;align-items:center;font-size:12px;color:#7f8fa1}
.term .tbar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.term .tout{padding:12px 14px;height:300px;overflow:auto;font-size:13.5px;line-height:1.6;color:#c9f7d4;white-space:pre-wrap;word-break:break-word}
.term .tout .cmd{color:#e6edf3}
.term .tout .err{color:#ff8a8a}
.term .tout .dir{color:#58a6ff;font-weight:600}
.term .tout .hid{color:#8b949e}
.term .tin{display:flex;align-items:center;border-top:1px solid #1d2a36;padding:8px 12px;gap:8px}
.term .tin span{color:#3ddc84;font-size:13.5px;white-space:nowrap}
.term .tin input{flex:1;background:transparent;border:0;outline:0;color:#e6edf3;font-size:14px;font-family:"JetBrains Mono",monospace}
.tasks{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.task.ok{border-color:var(--grn);background:var(--grnd)}
.task .tq{font-size:14px;margin-bottom:8px}
.task .tq b{color:var(--cy)}
.task .row2{display:flex;gap:8px}
.task input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font-family:"JetBrains Mono",monospace;font-size:13px;direction:ltr}
.task .btn{padding:8px 14px;font-size:13px}

/* ---- code review (level 1) ---- */
.code{background:#0b1118;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0;direction:ltr;text-align:left}
.code .ch{background:#111a24;padding:7px 12px;font-size:12px;color:#7f8fa1;display:flex;justify-content:space-between}
.code .ln{display:flex;font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.75;cursor:pointer;border-left:3px solid transparent}
.code .ln:hover{background:#13202c}
.code .ln .n{width:38px;text-align:right;padding-right:10px;color:#4b5b6b;flex-shrink:0;user-select:none}
.code .ln .t{white-space:pre;overflow-x:auto;color:#d6e2ee;padding-right:12px}
.code .ln.sel{background:#2a1a10;border-left-color:var(--gold)}
.code .ln.good{background:var(--grnd);border-left-color:var(--grn)}
.code .ln.bad{background:var(--redd);border-left-color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:8px 14px;cursor:pointer;font-size:13px}
.opt:hover{border-color:#2a3f52}
.opt.sel{border-color:var(--cy);background:#0d1f2b}
.opt.good{border-color:var(--grn);background:var(--grnd)}
.opt.bad{border-color:var(--red);background:var(--redd)}
.stepnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stepnav span{font-size:12px;padding:4px 10px;border-radius:20px;background:#132130;border:1px solid var(--line);color:var(--mut)}
.stepnav span.on{color:var(--txt);border-color:var(--red)}
.stepnav span.ok{color:var(--grn);border-color:#1c4a30}

/* ---- logs (level 4) ---- */
.logs{background:#05080c;border:1px solid #1d2a36;border-radius:12px;margin:12px 0;direction:ltr;text-align:left;max-height:360px;overflow:auto}
.logs .lh{position:sticky;top:0;background:#111a24;padding:7px 12px;font-size:12px;color:#7f8fa1;display:flex;justify-content:space-between;gap:8px}
.logs .lh input{background:#05080c;border:1px solid #1d2a36;border-radius:6px;color:#e6edf3;padding:3px 8px;font-size:12px;width:160px;font-family:"JetBrains Mono",monospace}
.logs pre{margin:0;padding:10px 12px;font-size:12px;line-height:1.7;color:#b8c7d6;white-space:pre}
.logs mark{background:#4a3b00;color:#ffe28a;border-radius:3px}

/* ---- leaderboard ---- */
.board{width:100%;border-collapse:collapse;font-size:14px}
.board td,.board th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
.board tr.me{background:#10232f}
.board .medal{font-size:18px}

/* keep wide code/log lines inside their own scroll box instead of stretching the page */
main{min-width:0}
.code{overflow-x:auto;max-width:100%}
.code .ln{min-width:max-content}
.logs,.term{max-width:100%}
@media(max-width:860px){ .code .ln{font-size:12px} .logs pre{font-size:11px} .term .tout{height:260px;font-size:12.5px} header{gap:10px} }

/* ---- institute branding ---- */
.logo-img{width:42px;height:45px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(242,193,78,.35))}
.logo span{font-size:11px;color:var(--gold);display:block;margin-top:1px}
.site-foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 16px 30px;border-top:1px solid var(--line);background:var(--panel2);text-align:right}
.site-foot img{width:34px;height:36px;object-fit:contain;opacity:.9}
.site-foot b{display:block;font-size:13px;color:#cfd8e3}
.site-foot span{font-size:12px;color:var(--gold)}
.hero-logo{position:absolute;left:28px;top:24px;width:92px;opacity:.9;filter:drop-shadow(0 0 18px rgba(242,193,78,.3))}
@media(max-width:860px){.hero-logo{position:static;display:block;width:62px;margin:0 0 12px auto}.logo span{font-size:10px}.logo-img{width:36px;height:38px}}
@media print{.site-foot,header,.mnav,nav.side,.helpbtn{display:none!important}}

</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDUGYkRQq3-IGlA0mFFrB7ON8r5tD1J_7E",authDomain:"osostl-attendance.firebaseapp.com",projectId:"osostl-attendance",storageBucket:"osostl-attendance.firebasestorage.app",messagingSenderId:"285186323376",appId:"1:285186323376:web:83958618d20bcab673dc75"};
let db=null, ME=null;
try{
  const app=initializeApp(cfg); db=getFirestore(app); const auth=getAuth(app);
  onAuthStateChanged(auth, async u=>{
    ME=null;
    if(u&&u.email){ const lp=u.email.split('@')[0];
      if(lp.startsWith('st-')){ const num=lp.split('-')[1]; let name=''; try{const sd=await getDoc(doc(db,'students',num)); if(sd.exists()) name=sd.data().name||'';}catch(e){} ME={role:'student',num,name}; }
      else if(u.email.startsWith('admin')||u.email.startsWith('acadmic')) ME={role:'admin'};
      else if(lp.startsWith('t-')) ME={role:'trainer'};
      else if(u.email.startsWith('audit')) ME={role:'auditor'}; }
    window.dispatchEvent(new CustomEvent('labauth',{detail:ME}));
  });
  onSnapshot(doc(db,'labCfg','help'), s=>window.dispatchEvent(new CustomEvent('labhelp',{detail:s.exists()?s.data().enabled!==false:true})), ()=>{});
  onSnapshot(doc(db,'labCfg','scenario'), s=>{ if(s.exists()&&s.data().id) window.dispatchEvent(new CustomEvent('labscen',{detail:s.data().id})); }, ()=>{});
}catch(e){ console.warn('Firebase offline — local mode', e); }
const list = async c => { if(!db) return null; try{ const s=await getDocs(collection(db,c)); return s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ return null; } };
window.LabCloud={
  async push(num,data){ if(db&&num) try{ await setDoc(doc(db,'campLab',num),data,{merge:true}); }catch(e){} },
  async pull(num){ if(!db||!num) return null; try{ const s=await getDoc(doc(db,'campLab',num)); return s.exists()?s.data():null; }catch(e){ return null; } },
  all: () => list('campLab'),
  async board(num,data){ if(db&&num) try{ await setDoc(doc(db,'labBoard',num),data); }catch(e){} },
  boardAll: () => list('labBoard'),
  async setHelp(on){ if(!db) return false; try{ await setDoc(doc(db,'labCfg','help'),{enabled:!!on},{merge:true}); return true; }catch(e){ return false; } },
  async setScenario(id){ if(!db) return false; try{ await setDoc(doc(db,'labCfg','scenario'),{id},{merge:true}); return true; }catch(e){ return false; } }
};
</script>

function doSQLi(){ const P = patchedOf("sqli"), u = val("sq_u"), r = $id("sq_r"), inj = /'\s*or\s*'?1'?\s*=\s*'?1|'\s*or\s*1=1|--|'\s*#/i.test(u);
  if (P || !inj) { r.innerHTML = res("err", "Login failed: invalid credentials." + (P && inj ? "  (input treated as data)" : "")); return; }
  r.innerHTML = res("flag", `✅ Logged in as: admin (user #1) — authentication bypassed!\nFLAG{${SC.tag}_sqli}`); hit("sqli"); }
function doXSS(){ const P = patchedOf("xss"), c = val("xs_c"); if (!c) return; window._xssC = (window._xssC || K().comments.seed).concat([c]);
  const host = $id("xs_list").closest(".sim").parentElement; host.innerHTML = SIM.xss(P); rebindTries(host);
  if (!P && /<script|onerror\s*=|onload\s*=|<img|<svg/i.test(c)) { const l = $id("xs_list"); l.classList.add("xssfire"); l.insertAdjacentHTML("afterend", res("flag", `⚠️ XSS FIRED — your code ran in every viewer's browser!\nFLAG{${SC.tag}_xss}`)); hit("xss"); } }
function doIDOR(){ const P = patchedOf("idor"), R = K().records, id = val("id_in").trim(), r = $id("id_r"), cu = $id("id_cur"); if (cu) cu.textContent = id;
  const rec = R.rows[id]; if (!rec) { r.innerHTML = res("err", "Not found."); return; }
  if (P && id !== R.mine) { r.innerHTML = res("err", "404 — Not found (ownership check: not yours)."); return; }
  const tbl = `<table><tr><th>Field</th><th>Value</th></tr><tr><td>id</td><td>#${esc(id)}</td></tr><tr><td>${R.f1}</td><td>${esc(rec[0])}</td></tr><tr><td>${R.f2}</td><td>${esc(rec[1])}</td></tr></table>`;
  if (id === R.mine) r.innerHTML = res("ok", "Yours:") + tbl; else { r.innerHTML = res("flag", `⚠️ You opened someone else's private record!\nFLAG{${SC.tag}_idor}`) + tbl; hit("idor"); } }
function doCMDI(){ const P = patchedOf("cmdi"), h = val("cm_h"), r = $id("cm_r"), sep = /[;|&`]|\$\(/.test(h), base = `PING ${h.split(/[;|&]/)[0] || "host"}: 64 bytes, time=12.4 ms`;
  if (P) { r.innerHTML = (sep || !/^[\w.\-]+$/.test(h)) ? res("err", "Rejected: invalid host format.") : res("ok", base); return; }
  if (sep) { r.innerHTML = res("flag", `${base}\n$ ${h.replace(/^[^;|&]*[;|&]+/, "").trim()}\nwww-data\n⚠️ Your extra command executed on the server!\nFLAG{${SC.tag}_cmdi}`); hit("cmdi"); } else r.innerHTML = res("ok", base); }
function doUpload(){ const P = patchedOf("upload"), f = val("up_f"), r = $id("up_r"), ok = new RegExp("\\.(" + K().upload.ok + ")$", "i").test(f), code = /\.(php\d?|phtml|jsp|aspx?|py|sh|cgi)$/i.test(f);
  if (P) { r.innerHTML = ok ? res("ok", "Uploaded safely (content validated, stored outside web root).") : res("err", "Rejected: content is not an allowed type."); return; }
  if (code) { r.innerHTML = res("flag", `Uploaded to /uploads/${f}\nVisiting https://${K().domain}/uploads/${f} …\n> server-side code EXECUTED\n⚠️ Server compromised!\nFLAG{${SC.tag}_upload}`); hit("upload"); } else r.innerHTML = ok ? res("ok", "Uploaded.") : res("err", "Unknown type (stored anyway)."); }
const COMMON = ["123456", "password", "admin", "12345678", "qwerty", "111111", "abc123", "admin123"];
function doAuth(){ const P = patchedOf("auth"), u = val("au_u"), p = val("au_p"), r = $id("au_r"); window._authTries = (window._authTries || 0) + 1; const t = $id("au_t"); if (t) t.textContent = window._authTries;
  if (P) { r.innerHTML = window._authTries > 5 ? res("err", "🔒 Account locked after 5 failed attempts (15 min).") : res("err", "Login failed."); return; }
  if (u === K().admin.user && COMMON.includes(p)) { r.innerHTML = res("flag", `✅ Logged in as admin with weak password "${p}"!\nFLAG{${SC.tag}_auth}`); hit("auth"); } else r.innerHTML = res("err", "Login failed."); }
function doSSRF(){ const P = patchedOf("ssrf"), u = val("ss_u"), r = $id("ss_r"), internal = /localhost|127\.0\.0\.1|169\.254\.|\/\/10\.|192\.168\.|internal|metadata|\[::1\]/i.test(u);

  if (internal) { r.innerHTML = res("flag", `Fetched ${u}\n--- internal response ---\n{ "service":"internal-admin", "token":"int-9f3a…" }\n⚠️ The server reached an internal-only service!\nFLAG{${SC.tag}_ssrf}`); hit("ssrf"); } else r.innerHTML = res("ok", "Fetched: 200 OK (image/png, 48 KB)"); }

function doMisconfig(){ const P = patchedOf("misconfig"), path = (val("mc_in") || "").trim().toLowerCase(), r = $id("mc_r"), pc = $id("mc_path"); if (pc) pc.textContent = path || "/";

  const hitp = Object.keys(S2).find(k => path === k || path === k.slice(1));

function doDataexp(){ const P = patchedOf("dataexp"), r = $id("de_r"), rows = K().data.rows;

  if (c.id === "bash") { const A = accessLog(E.bash), f = E.bash.file; return [
    {t: "text", q: `كم سطر في ملف السجل ${f}؟`, a: [String(A.n)], h: ["عدّ الأسطر يتم بأمر واحد.", "الأمر wc يعدّ، وخيار ‎-l للأسطر.", `wc -l ${f}`]},
    {t: "text", q: "كم طلب رجع رمز الحالة 404 (غير موجود)؟", a: [String(A.n404)], h: ["خلّ grep يفلتر الأسطر وبعدين عدّها.", "اربط grep مع wc -l بالأنبوب |", `grep " 404 " ${f} | wc -l`]},
    {t: "text", q: "وش عنوان IP اللي أرسل أكثر عدد من الطلبات؟", a: [A.top], h: ["العنوان هو أول حقل في كل سطر.", "cut يقص الحقل الأول، sort يرتّب، uniq -c يعدّ المكرّر، sort -nr يرتّب تنازلياً.", `cut -d' ' -f1 ${f} | sort | uniq -c | sort -nr | head -n 1`]},
    {t: "text", q: "كم عنوان IP مختلف ظهر في السجل؟", a: [String(A.uniq)], h: ["تحتاج قائمة العناوين بدون تكرار ثم تعدّها.", "sort -u يرتّب ويحذف المكرّر.", `cut -d' ' -f1 ${f} | sort -u | wc -l`]}]; }
  const src = c.id === "recon" ? E.recon.qs : E.system.qs;

function seededOrder(arr, seed){ let h = 2166136261 >>> 0; for (const ch of String(seed) + SC.id) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0; const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 2246822507) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- logs (ف١٨) ---------------- */
const _logs = {};
function logText(spec, seedKey){
  const k = SC.id + seedKey; if (_logs[k]) return _logs[k];
  const r = rng(seedKey.length * 131 + SC.num * 7), t0 = secs(spec.start || "09:00:00"), t1 = secs(spec.end || "10:00:00"), L = [];
  const inner = ["10.0.4.21", "10.0.4.33", "10.0.7.12", "10.0.9.8"], ua = "Mozilla/5.0 (Windows NT 10.0)";
  const acc = (t, ip, req, st, sz, user) => [t, `${ip} - ${user || "-"} [${spec.date}:${hms(t)} +0300] "${req} HTTP/1.1" ${st} ${sz} "-" "${ua}"`];
  const fmt = spec.fmt || "access";
  if (fmt === "access") for (let i = 0; i < 70; i++) L.push(acc(t0 + Math.floor(r() * (t1 - t0)), pick(r, inner), "GET " + pick(r, spec.paths), r() < .9 ? 200 : 304, 500 + Math.floor(r() * 8000)));
  if (fmt === "auth") for (let i = 0; i < 40; i++) { const t = t0 + Math.floor(r() * (t1 - t0)); L.push([t, `${spec.date} ${hms(t)} ${r() < .85 ? "LOGIN_OK " : "LOGIN_FAIL"} user=${pick(r, spec.users)} ip=${pick(r, inner)}`]); }
  if (fmt === "app") for (let i = 0; i < 60; i++) { const t = t0 + Math.floor(r() * (t1 - t0)); L.push([t, `${spec.date} ${hms(t)} ${pick(r, spec.events)} ip=${pick(r, inner)}`]); }
  (spec.attack || []).forEach(a => { const t = secs(a[0]); L.push(fmt === "access" ? acc(t, a[1], a[2], a[3], a[4]) : [t, `${spec.date} ${hms(t)} ${a[2]} ip=${a[1]}`]); });
  if (spec.brute) { const b = spec.brute; for (let i = 0; i < b.n; i++) { const t = secs(b.from) + i * b.step; L.push([t, `${spec.date} ${hms(t)} LOGIN_FAIL user=${b.user} ip=${b.ip}`]); } L.push([secs(b.ok), `${spec.date} ${b.ok} LOGIN_OK  user=${b.user} ip=${b.ip}`]); }
  if (spec.spray) { const s = spec.spray; s.list.forEach((u, i) => { const t = secs(s.from) + i * 21; L.push([t, `${spec.date} ${hms(t)} ${u === s.hit ? "LOGIN_OK " : "LOGIN_FAIL"} user=${u} ip=${s.ip} pass_hash=7f3c…`]); }); }
  if (spec.stuffing) { const s = spec.stuffing; s.list.forEach((u, i) => { const t = secs(s.from) + i * 9; L.push([t, `${spec.date} ${hms(t)} ${s.hits.includes(u) ? "LOGIN_OK " : "LOGIN_FAIL"} user=${u} ip=${s.ip}`]); }); }
  if (spec.enumerate) { const e = spec.enumerate; for (let i = 0; i < e.n; i++) { const t = secs(e.time) + i * 2; L.push(acc(t, e.ip, "GET " + e.path + (e.from + i), 200, 1700 + Math.floor(r() * 400), e.user)); } }
  L.sort((x, y) => x[0] - y[0]);
  return (_logs[k] = L.map(x => x[1]).join("\n"));
}
function logViewer(spec, key, fid){
  const txt = logText(spec, key), f = (window._lf || {})[fid] || "", lines = txt.split("\n"), shown = f ? lines.filter(l => l.toLowerCase().includes(f.toLowerCase())) : lines;
  const body = shown.map(l => { const e = esc(l); return f ? e.replace(new RegExp(esc(f).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`) : e; }).join("\n");
  return `<div class="logs"><div class="lh"><span>${esc(spec.file || "log")} · ${shown.length}/${lines.length} سطر</span><input data-lf="${fid}" placeholder="تصفية… مثل FAIL أو %27" value="${esc(f)}"></div><pre>${body}</pre></div>`;
}
function bindLogFilter(){ document.querySelectorAll("[data-lf]").forEach(x => { x.oninput = () => { window._lf = window._lf || {}; window._lf[x.dataset.lf] = x.value; const pos = x.selectionStart; renderChallenge(); const y = document.querySelector(`[data-lf="${x.dataset.lf}"]`); if (y) { y.focus(); y.setSelectionRange(pos, pos); } }; }); }
function qsBlock(Q, ans, pfx){
  return Q.map((q, i) => `<div class="task ${ans[i] ? "ok" : ""}"><div class="tq"><b>${i + 1}.</b> ${esc(q.q)}</div>
    ${ans[i] ? `<div style="color:var(--grn);font-size:13px">✓ ${esc(q.t === "mc" ? q.o[q.a] : q.a[0])}</div>`
      : q.t === "mc" ? `<div class="opts">${seededOrder(q.o.map((o, j) => [o, j]), pfx + i).map(([o, j]) => `<span class="opt" data-${pfx}mc="${i}|${j}">${esc(o)}</span>`).join("")}</div>`
      : `<div class="row2"><input id="${pfx}a${i}" placeholder="جوابك"><button class="btn" data-${pfx}chk="${i}">تحقّق</button></div>`}</div>`).join("");
}
function bindQs(Q, getAns, setAns, pfx, onAll){
  const ok = i => { const a = Object.assign({}, getAns(), {[i]: true}); setAns(a); toast("✅ صحيح!"); if (Q.every((_, k) => a[k])) onAll(); renderChallenge(); };
  document.querySelectorAll(`[data-${pfx}chk]`).forEach(b => { const i = +b.getAttribute(`data-${pfx}chk`), inp = $id(pfx + "a" + i); const go = () => okText(inp.value, Q[i].a) ? ok(i) : wrong(); b.onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); }; });
  document.querySelectorAll(`[data-${pfx}mc]`).forEach(x => x.onclick = () => { const [i, j] = x.getAttribute(`data-${pfx}mc`).split("|").map(Number); if (j === Q[i].a) ok(i); else { x.classList.add("bad"); wrong(); } });
}
function renderLogs(c){
  const L = SC.logs.find(x => x.id === c.id), ans = prog(c.id).q || {}, done = L.qs.every((_, i) => ans[i]);
  return `<div class="bl"><p>أنت محلّل في مركز العمليات الأمنية (SOC). اقرأ السجل، استخدم مربع التصفية لعزل الأسطر المشبوهة، وجاوب الأسئلة.</p></div>${logViewer(L, c.id, c.id)}<div class="tasks">${qsBlock(L.qs, ans, "lg")}</div>${done ? doneBox(c) : ""}`;

function bindLogs(c){ const L = SC.logs.find(x => x.id === c.id); bindLogFilter(); bindQs(L.qs, () => prog(c.id).q || {}, a => setP(c.id, {q: a}), "lg", () => finish(c)); }

/* ---------------- technical report (ف٢٠) ---------------- */
const SEV = ["حرجة", "عالية", "متوسطة", "منخفضة"];
const BADQ = {q: "وش الناقص في هذه الملاحظة لتصير ملاحظة تقرير احترافية؟", o: ["الموقع الدقيق، خطوات إعادة الإنتاج، الدليل، الأثر، الخطورة، والتوصية", "ألوان وتنسيق أجمل", "كلام أكثر عن خطورة الإنترنت", "ما ينقصها شي"], a: 0};
function renderReport(c){

/* ---------------- XP, ranks, levels ---------------- */
function chalDone(c, st){ const p = (st || state)[(c._sid || SID) + ":" + c.id] || {}; return c.type === "web" ? !!(p.exploited && p.defended && p.reported) : !!p.done; }
function tiersUsed(p){ return Object.values(p.ht || {}).reduce((a, b) => a + b, 0); }
function earned(c, sid){ const p = state[(sid || SID) + ":" + c.id] || {}; if (!chalDone({...c, _sid: sid || SID})) return 0; const pen = Math.min(0.3, (c.type === "web" ? 0.1 : 0.05) * tiersUsed(p)); return Math.round(c.xp * (1 - pen)); }
const totalXP = () => CH.reduce((a, c) => a + earned(c), 0);
const maxXP = () => CH.reduce((a, c) => a + c.xp, 0);
function xpFor(sid){ return buildChallenges(sid).reduce((a, c) => a + earned(c, sid), 0); }
const RANKS = [[0, "مبتدئ"], [0.12, "متدرّب"], [0.28, "مستكشف"], [0.45, "مخترق أخلاقي"], [0.62, "مدافع"], [0.8, "محلّل أمن"], [0.97, "خبير أسس"]];

const lvlCh = id => CH.filter(c => c.lvl === id);
function levelUnlocked(id){ const i = LEVELS.findIndex(l => l.id === id); for (let k = 0; k < i; k++) if (!lvlCh(LEVELS[k].id).every(c => chalDone(c))) return false; return true; }
function prevLevelName(id){ const i = LEVELS.findIndex(l => l.id === id); return i > 0 ? LEVELS[i - 1].ar : ""; }

/* ---------------- help gating & tiers ---------------- */
const TRIES = {}; let stationEnter = 0, helpTimer = null;
const HELP_STATIONS = ["discover", "exploit", "defend"], TRY_T = 2, TIME_T = 90000;
function bumpTry(){ if (!cur) return; TRIES[cur] = (TRIES[cur] || 0) + 1; if (TRIES[cur] >= TRY_T) applyHelpVisibility(); }
function rebindTries(host){ if (host) host.querySelectorAll("button").forEach(b => b.addEventListener("click", bumpTry)); }
function helpUnlocked(id){ return helpEnabled && !!id && ((TRIES[id] || 0) >= TRY_T || (stationEnter && Date.now() - stationEnter >= TIME_T)); }
function startHelpClock(){ stationEnter = Date.now(); clearTimeout(helpTimer); helpTimer = setTimeout(applyHelpVisibility, TIME_T); }
function applyHelpVisibility(){
  const b = $id("helpbtn"), c = curC(); if (!b) return;
  const okStation = c && (c.type !== "web" || HELP_STATIONS.includes(STATIONS[curTab].k));
  if (!c || !helpEnabled || !okStation || chalDone(c)) { b.style.display = "none"; return; }

  else { b.className = "helpbtn locked-pill"; b.style.display = "flex"; b.onclick = () => toast("🔒 حاول أولاً — المساعدة تنفتح بعد محاولتين أو بعد دقيقة ونص.", true); b.innerHTML = "🔒 المساعدة تُفتح بعد أن تحاول"; }
}
function hintsFor(c){
  const p = prog(c.id);
  if (c.type === "web") return {key: "w", t: [c.hint, c.help[0] + " " + c.help[1], c.help[2]]};
  if (c.type === "term") { const T = tasksOf(c), i = T.findIndex((_, k) => !(p.t || {})[k]); return i < 0 ? null : {key: "t" + i, t: T[i].h, label: `المهمة ${i + 1}`}; }
  if (c.type === "quiz") { const Q = quizOf(c), i = Q.findIndex((_, k) => !(p.q || {})[k]); return i < 0 ? null : {key: "q" + i, t: ["اقرأ كل كلمة في السؤال وارجع للنص المعروض.", Q[i].ex || "استبعد الخيارات الغريبة أولاً — غالباً يبقى خيار واحد منطقي.", `الجواب: ${Q[i].o[Q[i].a]}`], label: `السؤال ${i + 1}`}; }
  if (c.type === "code") { const S = SC.code, i = S.findIndex((_, k) => !((p.s || {})[k] || {}).v); return i < 0 ? null : {key: "s" + i, t: ["دوّر على السطر اللي يستخدم مدخل المستخدم مباشرة أو يقرّر الصلاحية.", S[i].why, `السطر رقم ${S[i].bad + 1}، والثغرة: ${VN[S[i].vuln]}`], label: S[i].file}; }

  else { setP(id, {dSel: null}); bumpTry(); toast("❌ هذا يعالج العَرَض مو الجذر — جرّب ثاني.", true); renderChallenge(); } }
function submitReport(id){ const c = CH.find(x => x.id === id), t = val("r_t").trim(), s = val("r_st").trim(), e = val("r_e").trim();
  if (t.length < 8 || s.length < 8) return toast("✍️ اكتب عنواناً وخطوات أوضح", true);
  if (e !== `FLAG{${SC.tag}_${c.vuln}}`) { bumpTry(); return toast("📎 الدليل غير صحيح — الصق العلم اللي ظهر لك في محطّة «اهجم»", true); }
  setP(id, {reported: true, rep: {t, sev: val("r_s"), s}}); toast("🏆 تحدٍّ مكتمل!"); renderSide(); renderChallenge(); }

/* ---------------- certificate ---------------- */
function showCert(){
  if (!allComplete()) return toast("أكمل كل التحدّيات أولاً", true);
  cur = null; closeHelp(); $id("helpbtn").style.display = "none";
  const nm = (ME && ME.name) || (() => { try { return localStorage.getItem("labCertName") || ""; } catch (e) { return ""; } })(), d = new Date();
  $id("main").innerHTML = `<div style="max-width:780px;margin:0 auto">${nm ? "" : `<div class="bl"><h4>✍️ اسمك على الشهادة</h4><input id="certName" style="width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--txt);margin-top:8px"><div class="rowbtns"><button class="btn" onclick="try{localStorage.setItem('labCertName',val('certName').trim())}catch(e){};if(!ME)ME={};ME.name=val('certName').trim();showCert()">اعتمد</button></div></div>`}
    <div style="background:linear-gradient(135deg,#0d1a24,#0a1118);border:2px solid var(--gold);border-radius:18px;padding:38px 34px;text-align:center">
      <img src="${LOGO()}" alt="" style="width:86px;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(242,193,78,.35))"><div style="font-size:13px;letter-spacing:2px;color:var(--gold)">معهد أسس التقنية والقانون العالي للتدريب</div><div style="font-size:11px;color:var(--mut);margin-bottom:18px">OSOS INSTITUTE · CYBER LAB</div>
      <div style="font-size:20px;color:#c6d2df">شهادة إتمام مختبر الأمن السيبراني</div><div style="font-size:13px;color:var(--mut);margin:4px 0 18px">${SC.icon} السيناريو ${AR_NUM(SC.num)} · ${esc(SC.ar)}</div>
      <div style="font-size:13px;color:var(--mut)">تُمنح هذه الشهادة إلى</div><div style="font-size:30px;font-weight:700;color:var(--gold);margin:8px 0">${esc(nm || "—")}</div>${ME && ME.num ? `<div style="font-size:12px;color:var(--mut)">الرقم التدريبي: ${esc(ME.num)}</div>` : ""}
      <div style="font-size:14px;color:#c6d2df;max-width:560px;margin:16px auto;line-height:1.9">لإتمامه ${CH.length} تحدياً عملياً في سبعة مستويات تطابق فصول كتاب المتدرّب العملي: التأسيس، اللغة، الفريق الأحمر، الفريق الأزرق، التقرير الفني، والمشروع الختامي.</div>
      <div style="display:flex;justify-content:space-between;margin-top:24px;border-top:1px solid #1e2a38;padding-top:14px;font-size:12px;color:var(--mut)"><div>التاريخ<br><b style="color:var(--txt)">${d.getDate()} / ${d.getMonth() + 1} / ${d.getFullYear()}</b></div><div>المجموع<br><b style="color:var(--grn)">${totalXP()} XP · ${rankOf(totalXP())}</b></div><div>المشرف على البرنامج<br><b style="color:var(--txt)">Khalid Alhussaini</b></div></div></div>
    <div class="rowbtns" style="justify-content:center"><button class="btn o" onclick="goHome()">← رجوع</button><button class="btn" style="background:var(--gold);color:#2a1e00" onclick="window.print()">🖨️ طباعة / PDF</button></div></div>`;
}

/* ---------------- leaderboard ---------------- */
async function showBoard(){
  cur = null; closeHelp(); $id("helpbtn").style.display = "none"; renderSide();
  $id("main").innerHTML = `<div class="hero"><h1>📊 لوحة الصدارة</h1><div class="en">${SC.icon} السيناريو ${AR_NUM(SC.num)} · ${esc(SC.ar)}</div></div><div id="brd" class="bl">جارِ التحميل…</div><div class="rowbtns"><button class="btn o" onclick="goHome()">← رجوع</button></div>`;
  const rows = window.LabCloud ? await window.LabCloud.boardAll() : null, box = $id("brd");
  if (!rows) { box.innerHTML = `<p>لوحة الصدارة تشتغل لما تدخل المختبر من البوابة وأنت مسجّل دخول.</p><p style="margin-top:6px">نقاطك الحالية: <b style="color:var(--grn)">${totalXP()} XP</b> · ${rankOf(totalXP())}</p>`; return; }
  const list = rows.map(r => ({name: r.name, num: r.id, xp: (r.xp || {})[SID] || 0})).filter(r => r.xp > 0).sort((a, b) => b.xp - a.xp).slice(0, 30);
  box.innerHTML = list.length ? `<table class="board"><tr><th>#</th><th>المتدرّب</th><th>XP</th></tr>${list.map((r, i) => `<tr class="${ME && ME.num === r.num ? "me" : ""}"><td>${i < 3 ? `<span class="medal">${["🥇", "🥈", "🥉"][i]}</span>` : i + 1}</td><td>${esc(r.name)}</td><td><b>${r.xp}</b></td></tr>`).join("")}</table><p style="font-size:12px;color:var(--mut);margin-top:8px">الترتيب للتحفيز — التقييم الرسمي يبقى اختبار البوابة.</p>` : "<p>ما فيه نقاط بعد في هذا السيناريو. كن الأول!</p>";
}

/* ---------------- instructor dashboard (?admin=1) ---------------- */
async function renderAdmin(){
  $id("helpbtn").style.display = "none";
  $id("main").innerHTML = `<div class="hero"><h1>لوحة المشرف · المختبر</h1><div class="en">Instructor Dashboard</div><p>اختر السيناريو للدفعة، تحكّم بزر المساعدة، وتابع تقدّم كل طالب.</p></div>
    <div class="bl"><h4>🎬 السيناريو الحالي للطلاب</h4><p>تغييره يطبّق على كل الطلاب فوراً. تقدّم كل طالب محفوظ لكل سيناريو على حدة، فتقدر ترجع له.</p>
      <div class="grid" style="margin-top:10px">${Object.values(SCEN).map(s => `<div class="card" style="${s.id === SID ? `border-color:${s.color};box-shadow:0 0 0 2px ${s.color}55` : ""}" onclick="setScen('${s.id}')"><h3>${s.icon} السيناريو ${AR_NUM(s.num)}</h3><div class="en">${esc(s.en)}</div><p>${esc(s.ar)}</p><div class="foot"><span>${s.id === SID ? "✅ المفعّل الآن" : "اضغط للتفعيل"}</span><a href="?scen=${s.id}" target="_blank" onclick="event.stopPropagation()" style="font-size:12px">معاينة ↗</a></div></div>`).join("")}</div></div>
    <div class="bl"><h4>🆘 زر «تورطت؟ ساعدني»</h4><div class="rowbtns"><button class="btn g" onclick="toggleHelp(true)">✅ تشغيل</button><button class="btn" onclick="toggleHelp(false)">🚫 إيقاف (وقت الاختبارات)</button><span id="hs" style="align-self:center;color:var(--mut)">الحالة: ${helpEnabled ? "مُفعّل" : "موقوف"}</span></div></div>
    <div id="roster" class="bl">جارِ تحميل الطلاب…</div>`;
  const rows = window.LabCloud ? await window.LabCloud.all() : null, box = $id("roster");
  if (!rows) { box.innerHTML = "تعذّر التحميل — افتح الصفحة وأنت مسجّل كمشرف/مدرب من نطاق البوابة."; return; }
  const list = rows.map(st => { const pr = st.prog || {}, per = LEVELS.map(L => { const it = lvlCh(L.id); return [it.filter(c => chalDone(c, pr)).length, it.length]; }), dn = per.reduce((a, x) => a + x[0], 0); return {st, per, pct: Math.round(dn / CH.length * 100)}; }).filter(x => x.pct > 0 || true).sort((a, b) => b.pct - a.pct);
  box.innerHTML = `<h4>👥 تقدّم الطلاب — ${SC.icon} ${esc(SC.ar)}</h4><div style="overflow:auto"><table class="board"><tr><th>الطالب</th>${LEVELS.map(L => `<th title="${L.ar}">م${AR_NUM(L.id.slice(1))}</th>`).join("")}<th>%</th></tr>${list.map(x => `<tr><td><b>${esc(x.st.name || "—")}</b><br><span style="font-size:11px;color:var(--mut)">#${esc(x.st.num || x.st.id)}</span></td>${x.per.map(([a, b]) => `<td style="color:${a === b ? "var(--grn)" : a ? "var(--gold)" : "#3a4a5a"}">${a}/${b}</td>`).join("")}<td><b>${x.pct}%</b></td></tr>`).join("")}</table></div>
    <p style="font-size:12px;color:var(--mut);margin-top:8px">م٠ التأسيس · م١ اللغة · م٢–م٣ الفريق الأحمر · م٤ الفريق الأزرق · م٥ التقرير · م٦ الختامي</p>`;
}
async function setScen(id){ if (id === SID) return; const ok = window.LabCloud ? await window.LabCloud.setScenario(id) : false; setScenario(id, true); toast(ok ? `✅ صار ${SCEN[id].ar} هو سيناريو كل الطلاب` : "تعذّر الحفظ في القاعدة (طُبّق محلياً فقط)", !ok); renderAdmin(); }
async function toggleHelp(on){ const ok = window.LabCloud ? await window.LabCloud.setHelp(on) : false; helpEnabled = on; $id("hs").textContent = "الحالة: " + (on ? "مُفعّل" : "موقوف"); toast(ok ? `تم ${on ? "تشغيل" : "إيقاف"} زر المساعدة لكل الطلاب` : "تعذّر الحفظ (محلياً فقط)", !ok); }

/* ---------------- portal events ---------------- */
window.addEventListener("labauth", async e => {
  ME = e.detail;
  if (ME && ME.role === "student" && ME.num && window.LabCloud) { const r = await window.LabCloud.pull(ME.num); if (r && r.prog) { Object.keys(r.prog).forEach(k => { state[k] = Object.assign({}, r.prog[k], state[k]); }); try { localStorage.setItem("ososlab2", JSON.stringify(state)); } catch (x) {} } }
  if (ADMINVIEW && ME && ["admin", "trainer", "auditor"].includes(ME.role)) renderAdmin(); else if (!ADMINVIEW) { if (cur) renderChallenge(); else goHome(); }
});
window.addEventListener("labhelp", e => { helpEnabled = e.detail !== false; applyHelpVisibility(); });
window.addEventListener("labscen", e => { const id = e.detail; if (SCEN_URL || !SCEN[id] || id === SID) return; setScenario(id); if (ADMINVIEW) renderAdmin(); else goHome(); });

/* ---------------- init ---------------- */
const LOGO = () => (document.querySelector(".logo-img") || {}).src || "";
{ const fl = $id("footLogo"); if (fl) fl.src = LOGO(); }
setScenario(SID, true);
if (ADMINVIEW) $id("main").innerHTML = `<div class="bl">جارِ التحقّق من صلاحية المشرف…</div>`; else goHome();

</script>
</body>
</html>
